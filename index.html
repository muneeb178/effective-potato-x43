  --bg:#141619; --surface:#1f2226; --surface-2:#2c3035; --line:#33383e; --panel:#191b1e;

  --font:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}
.cityico{display:inline-block;width:22px;height:24px;background:currentColor;-webkit-mask:var(--minar) center/contain no-repeat;mask:var(--minar) center/contain no-repeat}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0c0e;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,label{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);visibility:hidden;pointer-events:none;contain:layout paint;will-change:transform;transform:translateZ(0)}
.screen.on,.screen.under,.screen.out-r{visibility:visible}
.screen.on{pointer-events:auto}
.screen.under{z-index:1}.screen.on{z-index:2}
.screen.in-r{z-index:3;animation:inR .28s cubic-bezier(.22,.9,.24,1) both;will-change:transform;backface-visibility:hidden}
.screen.out-r{z-index:3;animation:outR .24s cubic-bezier(.4,0,.6,1) both;will-change:transform;backface-visibility:hidden}
.screen.in-l{animation:inL .26s cubic-bezier(.22,.9,.24,1) both;will-change:transform}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outR{from{transform:none}to{transform:translateX(100%)}}
@keyframes inL{from{transform:translateX(-22%)}to{transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.note{color:var(--muted);font-size:14px;padding:16px 20px;line-height:1.45}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.pill{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.hright{display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;flex:none}
.iconbtn.round{background:var(--surface-2);width:38px;height:38px}

/* tabs */
.tabs{display:flex;border-bottom:3px solid var(--surface-2);margin:0 0 12px;flex:none}
.tab{flex:1;padding:8px 0;font-weight:600;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.tab.on{color:var(--text)}
.tabs{position:relative}
.tabind{position:absolute;left:0;bottom:-3px;width:50%;height:3px;background:var(--text);will-change:transform}
.homebody{timeline-scope:--tabsx}
.tabclip{scroll-timeline:--tabsx x}
@keyframes tabslide{from{transform:translateX(0)}to{transform:translateX(100%)}}
@supports (animation-timeline:scroll()){#tabs .tabind{animation:tabslide linear both;animation-timeline:--tabsx}}
#s-search .tabind{transform:none}
.tab{transition:color .25s}
.tabclip{flex:1;position:relative;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tabclip::-webkit-scrollbar{display:none}
.tabtrack{display:flex;width:200%;height:100%}
.tabpane{width:50%;height:100%;display:flex;flex-direction:column;min-height:0;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
#lines{overflow-y:auto;padding:0 0 90px}
.lcard{margin:0 12px 10px;background:var(--surface);border-radius:14px;overflow:hidden;flex:none}
.lhead{display:flex;gap:12px;align-items:flex-start;padding:13px 14px 10px}
.lhead .nm{font-size:16px;font-weight:700}
.ltog{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.ltog svg{transition:transform .3s}
.lcard.open .ltog svg{transform:rotate(180deg)}
.lbody{display:none}
.lcard.open .lbody{display:block;animation:lfade .2s ease-out}
@keyframes lfade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.lst{display:grid;grid-template-columns:64px 20px 1fr;align-items:center;height:32px;padding:0 14px 0 0;font-size:15px}
.lst .km{color:var(--muted);text-align:right;padding-right:10px;font-size:13px}
.lst .rail{position:relative;height:100%;display:flex;justify-content:center}
.lst .rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--lc)}
.lst:first-child .rail::before{top:50%}.lst:nth-last-child(2) .rail::before{bottom:50%}
.lst .rail i{position:relative;align-self:center;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--lc)}
.lst .x{display:flex;gap:6px;align-items:center;padding-left:8px;min-width:0}
.lst .x>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* from / to */
.fields{padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;position:relative;flex:none}
.fields::before{content:"";position:absolute;left:37px;top:19px;bottom:19px;width:2px;background:#4a5056}
.field{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:10px;padding:6px 14px;text-align:left;width:100%;min-height:38px;position:relative}
.field .ph{color:var(--muted);font-size:16px}
.field .val{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.dot{width:15px;height:15px;border-radius:50%;flex:none;border:4px solid var(--accent);background:var(--bg);position:relative;z-index:1}
.dot.b{border-color:var(--blue)}
.swap{position:absolute;right:22px;top:44px;width:32px;height:32px;display:grid;place-items:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 10px;flex:none}
.chip{position:relative;background:var(--surface);border-radius:999px;padding:4px 13px;font-weight:500;font-size:15px;display:flex;gap:8px;align-items:center}
#when-in{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.showbtn{position:absolute;left:14px;right:14px;bottom:12px;z-index:21;background:#11a36b;color:#fff;border-radius:12px;padding:11px 18px;font-size:16px;font-weight:600;display:flex;justify-content:center;align-items:center;box-shadow:0 4px 18px #0009}
.showbtn svg{position:absolute;right:18px}
.go{background:var(--accent);color:#06200f;font-weight:700;border-radius:999px;padding:11px 20px;font-size:17px}

/* ad slots: placeholder boxes in standard AdMob sizes */
.adband{background:#000;border-top:1px solid #26292d;border-bottom:1px solid #26292d;padding:4px 0 8px;text-align:center;flex:none}
.adband .lbl{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:4px;font-weight:600}
.adbox{margin:0 auto;width:300px;max-width:calc(100% - 24px);height:250px;border:1px dashed #3a3f45;display:grid;place-items:center;color:#5f666e;font-size:13px;background:repeating-linear-gradient(45deg,#0c0d0f 0 10px,#111316 10px 20px)}
.adband.slim .adbox{width:320px;height:100px}
.homebody{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* routes history bottom sheet */
.hsscroll{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:20;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.hsscroll::-webkit-scrollbar{display:none}
.hsspace{height:172px;scroll-snap-align:start}
.hsheet{position:relative;height:100%;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 12px #0007;pointer-events:auto;scroll-snap-align:end}
.hsheet[hidden]{display:none}
.showbtn{transition:opacity .2s}
.hs-top{cursor:pointer;padding:8px 0 2px;flex:none}
.grab{width:40px;height:4px;border-radius:3px;background:#4a5056;margin:2px auto 6px}
.hs-title{display:flex;justify-content:space-between;align-items:center;padding:0 10px 0 20px}
.hs-title h2{font-size:21px;font-weight:700;letter-spacing:-.4px;padding:0 0 4px}
#hs-close{display:none}
.hsheet.open #hs-close{display:grid}
.hsheet.open .grab{visibility:hidden;height:0;margin:0}
#hist{flex:1;overflow-y:auto;padding-bottom:20px}
.hsheet:not(.open) #hist{overflow:hidden}
.hsheet:not(.open) .hday{display:none}
.hday{color:var(--muted);font-size:14px;padding:18px 20px 2px}
.hist{display:block;width:100%;text-align:left;padding:10px 20px 12px}
.hist .l{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:500;line-height:1.2}
.hist .arr{color:var(--muted);font-size:12px;padding:0 0 0 3px;line-height:12px;height:12px}

/* bottom nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 0 calc(5px + env(safe-area-inset-bottom));flex:none;position:relative;z-index:25}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--text)}

/* search */
.sf{padding:0 4px 0 14px}
.sf input{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:16px;font-weight:500;padding:9px 0;outline:none}
.sf input::placeholder{color:var(--muted);font-weight:400}
.sf{transition:min-height .28s cubic-bezier(.22,.9,.24,1),background-color .28s}
.sf input{transition:transform .28s cubic-bezier(.22,.9,.24,1);transform-origin:0 50%;will-change:transform;font-size:16px!important}
.sf.act{background:var(--surface-2);min-height:50px}
.sf.act input{transform:scale(1.15);width:87%}
#s-search .fields{contain:layout}
.sf .loc{transition:opacity .2s}
.sf .loc{display:grid;opacity:0;pointer-events:none}.sf.act .loc{opacity:1;pointer-events:auto}
#opts{background:#000;margin-top:10px}
#opts.fade{animation:ofade .18s ease-out}
@keyframes ofade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 8px 10px 16px;border-bottom:2px solid #000;background:var(--surface)}
.oico{width:34px;height:34px;border-radius:50%;border:2.5px solid #e6e9ec;display:grid;place-items:center;flex:none;color:#e6e9ec}
.oico.stn{border-radius:11px;font-weight:800;font-size:13px}
.otx{flex:1;min-width:0}
.opt .t{font-size:16px;font-weight:600;line-height:1.25}
.opt .s{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km{color:var(--blue)}
.fill{width:38px;height:38px;display:grid;place-items:center;color:#c8ced4;flex:none;border-radius:50%}
.sec{color:var(--muted);font-size:12px;padding:12px 16px 6px;background:#000;letter-spacing:.3px}
.loading{padding:16px 18px;color:var(--muted);font-size:14px;background:var(--surface)}
.selmap{display:flex;align-items:center;gap:16px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));font-size:16px;font-weight:600;background:var(--surface);border-top:8px solid #000;flex:none;width:100%;text-align:left}

/* results */
.rhead{display:flex;gap:12px;padding:2px 16px 10px;align-items:center;flex:none}
.rhead .ft{flex:1;display:grid;grid-template-columns:16px 1fr;gap:6px 12px;align-items:center;font-size:16px;font-weight:600;min-width:0;text-align:left}
.rhead .ft div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vline{grid-row:1/3;align-self:stretch;display:flex;flex-direction:column;align-items:center}
#cards{background:#000}
.card{display:grid;grid-template-columns:auto 1fr;gap:0 14px;width:calc(100% - 20px);margin:10px;background:var(--surface);border-radius:14px;padding:13px 14px 12px;text-align:left;align-items:start}
.card:active{background:#262a2f}
.dep{min-width:72px}
.dep small{display:block;font-size:13px;color:#d5dade;font-weight:500}
.dep b{display:block;font-size:36px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin-top:2px}
.dep b i{font-style:normal;font-size:16px;font-weight:600;letter-spacing:0;margin-left:3px}
.crt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:6px;color:#e6e9ec}
.chev{color:var(--muted)}
.badge{border-radius:6px;padding:2px 7px;font-weight:800;font-size:13px;color:#fff;display:inline-flex;align-items:center}
.badge.ol{background:var(--ol);color:#2a1400}
.badge.mb{background:var(--mb)}
.tot{color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap}
.legs{display:flex;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center;gap:4px;margin-top:9px;font-size:13px;letter-spacing:-.1px;color:#c3c9ce}
.wk{display:inline-flex;align-items:center;gap:1px}
.wk svg{width:14px;height:14px}
.t-g{background:var(--accent);color:#06200f;font-weight:600;border-radius:999px;padding:1px 6px}
.t-b{background:var(--blue);color:#021623;font-weight:600;border-radius:999px;padding:1px 6px}
.cmeta{font-size:12px;color:var(--muted);margin-top:7px}
.banner{margin:12px;padding:12px 14px;border-radius:12px;background:#3a2a10;color:#ffd391;font-size:14px;line-height:1.45}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:6px 16px 0}

/* trip detail: map left, sliding timeline right */
.dsum{padding:0 16px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:start;flex:none}
.dsplit{position:relative;flex:1;overflow:hidden;background:#2a3242;min-height:0}
.rchip{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:5px;font-weight:800;font-size:10px;color:#fff;transform:translate(-50%,-50%);white-space:nowrap;box-shadow:0 2px 8px #0008;border:2px solid #0006}
.rchip svg{display:none}
.lbl-hide .perm{display:none}
.xfer{width:22px;height:22px;border-radius:6px;background:#f2f4f5;color:#121417;display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 2px 8px #0008}
.tad{padding:16px 0 0}
.tad.rest{display:none}
.dhdr{position:relative;z-index:5;background:var(--bg)}
.dbody{position:absolute;left:0;right:0;top:var(--hdr,54px);height:calc(100% - var(--hdr,54px) + var(--adh,121px));display:flex;flex-direction:column;
  transition:transform .4s cubic-bezier(.22,.9,.24,1);will-change:transform}
.dbody.adhide{transform:translateY(calc(-1 * var(--adh,121px)))}
.dad .adband{transition:opacity .35s ease .05s}
.dbody.adhide .dad .adband{opacity:0}
#s-detail .dfoot{display:flex;transform:translateY(140%);transition:transform .32s cubic-bezier(.22,.9,.24,1)}
#s-detail.open.ft .dfoot{transform:none}
.dad{flex:none}
.dmapctl{z-index:620}
.dbody:not(.adhide) ~ .dmapctl,.dbody:not(.adhide) ~ .dfoot{transform:none}
.credit{background:#000a;color:#c8ced4;font:500 10px var(--font);padding:2px 6px;border-radius:4px;margin:4px!important;border:0}
#dmap{position:absolute;inset:0;z-index:0}
.tpscroll{position:absolute;inset:0;z-index:600;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;pointer-events:none;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tpscroll::-webkit-scrollbar{display:none}
.tpspace{flex:none;width:calc(100% - 92px);scroll-snap-align:start}
.tpanel{position:relative;flex:none;width:calc(100% - 46px);height:100%;background:var(--panel);box-shadow:-8px 0 20px #0007;pointer-events:auto;scroll-snap-align:end}
.tscroll{height:100%;overflow-y:auto;padding:10px 0 120px}
.peek{position:absolute;left:0;top:0;bottom:0;width:46px;z-index:650;display:none}
#s-detail.open .peek{display:block}
.dfoot{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:none;gap:10px;z-index:700}
.fbtn{border-radius:11px;padding:9px 13px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 4px 16px #0009;white-space:nowrap}
.fbtn.w{background:#f2f4f5;color:#121417}
.fbtn.y{background:var(--yellow);color:#1b1600;flex:1}
.st{display:grid;grid-template-columns:92px 1fr;gap:0 8px;padding:0 16px 0 0}
.st .c{display:flex;flex-direction:column;align-items:center}
.st .b{padding:6px 0 12px;min-width:0}
.st.sep .b{border-top:3px solid #0b0c0e;padding-top:12px}
.st.sep .c{padding-top:12px}
.time{border-radius:999px;font-weight:700;padding:3px 9px;font-size:14px;background:var(--surface-2)}
.time.g{background:var(--accent);color:#06200f}

.time.o::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;border:3px solid #fff;margin-right:6px;vertical-align:-1px}
.vbar{width:6px;flex:1;min-height:20px;border-radius:0}
.ring{width:16px;height:16px;border-radius:50%;border:4px solid;background:var(--panel);margin-top:-2px;flex:none}
.tog svg{transition:transform .25s}
.tog.open svg{transform:rotate(180deg)}
.vdots{flex:1;min-height:34px;width:6px;background:radial-gradient(circle,#7d848b 2.6px,transparent 3px) center/6px 14px repeat-y}
.circ{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;margin:6px 0}
.sname{font-size:17px;font-weight:700;line-height:1.25}
.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.4}
.ride{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;flex-wrap:wrap}
.ride .dur{margin-left:auto;color:var(--muted)}
.freq{font-size:14px;margin-top:8px}
.tog{display:flex;justify-content:space-between;width:100%;padding:10px 0 8px;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.walk{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:8px 0}
.walk span:last-child{color:var(--muted);white-space:nowrap;padding-left:10px}
.pm{display:grid;grid-template-columns:92px 1fr;gap:0 8px;padding:0 16px 0 0;height:33px}
.pm .c{display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.pm .c .vbar{min-height:8px}
.pm .mt{font-size:14px;font-weight:700;padding:1px 0;line-height:1.2}
.pm .b{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.pm .b .n{color:var(--muted)}

/* lines screen */
.mid{display:grid;grid-template-columns:86px 1fr;gap:0 12px;padding:0 18px}
.mid .c{display:flex;justify-content:center}
.mid .b{display:flex;gap:10px;padding:9px 0;font-size:15px;color:#d5dade}
.mid .b .tt{color:var(--muted);width:50px;flex:none}

/* maps */
.mapwrap{position:relative;flex:1;overflow:hidden;background:#2a3242}

.mapctl button{width:42px;height:42px;border-radius:50%;background:#1d2024;display:grid;place-items:center;box-shadow:0 2px 12px #0008}
.legend{position:absolute;right:12px;top:12px;background:#000b;border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px}
.pickbar{position:absolute;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px #000a}
.pickbar[hidden]{display:none}
.pickbar .txt{flex:1;font-size:14px;color:var(--muted)}
.pickbar .go:disabled{opacity:.35}
#lmap{position:absolute;inset:0}
.leaflet-container{font-family:var(--font);background:#2a3242}
.leaflet-control-attribution{background:#000a!important;color:#9aa1a8!important;font-size:10px}
.leaflet-control-attribution a{color:#c8ced4!important}
.leaflet-tooltip.st-label{background:#141619e6;border:0;color:#e6e9ec;font-weight:600;font-size:12px;padding:2px 6px;border-radius:6px;box-shadow:none}
.leaflet-tooltip.st-label::before{display:none}
.pinlbl{background:#f2f4f5;color:#121417;font-weight:700;font-size:11px;padding:2px 7px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-160%);display:inline-block;box-shadow:0 2px 8px #0007}

.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:#f2f4f5;color:#121417;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:2000}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hsscroll,.toast,.lbody{transition:none}.screen{animation:none!important}}
</style>

const R=6371000, rad=x=>x*Math.PI/180;
function dist(a,b){const dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng);const h=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const WALK_DETOUR=1.3, WALK_MPM=80; // street detour factor, 80 m per minute (4.8 km/h)
const walkM=(a,b)=>dist(a,b)*WALK_DETOUR;
const walkMin=m=>Math.max(1,Math.round(m/WALK_MPM));

// build stations
const STATIONS=[];
for(const L of Object.values(LINES)){
  L.stops=L.st.map(([name,lat,lng],i)=>{const s={id:L.id+":"+i,name,lat,lng,line:L.id,i,under:L.underground.includes(name)};STATIONS.push(s);return s;});
  // cumulative km + minutes
  L.cumKm=[0];L.cumMin=[0];
  if(L.id==="MB"){for(let i=1;i<L.stops.length;i++){L.cumKm[i]=L.cumKm[i-1]+L.km[i];L.cumMin[i]=L.cumKm[i]/L.speedKmh*60;}}
  else{let tot=0;const seg=[0];for(let i=1;i<L.stops.length;i++){const d=dist(L.stops[i-1],L.stops[i])/1000;seg.push(d);tot+=d;}
    for(let i=1;i<L.stops.length;i++){L.cumKm[i]=L.cumKm[i-1]+seg[i]*L.trackKm/tot;L.cumMin[i]=L.cumKm[i]/L.trackKm*L.fullMin;}}
}
// project each station onto its line's track, so ride legs follow the real road / viaduct
function projOn(path,p){const kx=Math.cos(rad(31.5));let best={d:1e18,i:0,t:0,pt:path[0]};
  for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];const dx=(b[1]-a[1])*kx,dy=b[0]-a[0];const L2=dx*dx+dy*dy||1e-12;
    let t=(((p.lng-a[1])*kx)*dx+(p.lat-a[0])*dy)/L2;t=Math.max(0,Math.min(1,t));const x=a[1]+t*(b[1]-a[1]),y=a[0]+t*(b[0]-a[0]);
    const d=((p.lng-x)*kx)**2+(p.lat-y)**2;if(d<best.d)best={d,i,t,pt:[y,x]};}return best;}
for(const L of Object.values(LINES)){L.geom=GEOM[L.id];L.proj=L.stops.map(s=>projOn(L.geom,s));}
function trackBetween(lineId,a,b){const L=LINES[lineId],A=L.proj[a.i],B=L.proj[b.i];
  if(A.i+A.t<=B.i+B.t)return[A.pt,...L.geom.slice(A.i+1,B.i+1),B.pt];
  return[A.pt,...L.geom.slice(B.i+1,A.i+1).reverse(),B.pt];}
const ACCESS_MIN=2; // stairs / security / token at elevated & underground stations
// transfers between lines: walk <= 900 m
const TRANSFERS=[];
for(const a of LINES.OL.stops)for(const b of LINES.MB.stops){const m=walkM(a,b);if(m<=900){TRANSFERS.push({a,b,m});TRANSFERS.push({a:b,b:a,m});}}

function fareFor(lineId,i,j){const L=LINES[lineId];if(lineId==="MB")return MB_FARE;const km=Math.abs(L.cumKm[j]-L.cumKm[i]);for(const[max,f]of OL_FARE)if(km<=max)return f;return 45;}
function rideMin(lineId,i,j){const L=LINES[lineId];return Math.max(2,Math.round(Math.abs(L.cumMin[j]-L.cumMin[i])));}
function nextDep(L,t,off=0){ // minutes since midnight; trains leave the terminus every headway from opening, reaching this station off minutes later
  const b=L.open+off;if(t<b)return b; const k=Math.ceil((t-b)/L.headway);return b+k*L.headway;}

// ---------------------------------------------------------------- ROUTER
const MAX_ACCESS_WALK=2600; // m (walk-distance incl. detour)
function nearest(p,line,n){return LINES[line].stops.map(s=>({s,m:walkM(p,s)})).filter(x=>x.m<=MAX_ACCESS_WALK).sort((x,y)=>x.m-y.m).slice(0,n);}

function plan(A,B,startMin){
  const opts=[];
  const direct=walkM(A,B);
  for(const line of ["OL","MB"]){
    for(const o of nearest(A,line,3))for(const d of nearest(B,line,3)){if(o.s.i===d.s.i)continue;
      opts.push([{type:"walk",from:A,to:o.s,m:o.m},fixStops(legRide(line,o.s,d.s)),{type:"walk",from:d.s,to:B,m:d.m}]);}
  }
  for(const tr of TRANSFERS){const l1=tr.a.line,l2=tr.b.line;
    for(const o of nearest(A,l1,3))for(const d of nearest(B,l2,3)){if(o.s.i===tr.a.i||d.s.i===tr.b.i)continue;
      opts.push([{type:"walk",from:A,to:o.s,m:o.m},fixStops(legRide(l1,o.s,tr.a)),{type:"walk",from:tr.a,to:tr.b,m:tr.m,transfer:true},fixStops(legRide(l2,tr.b,d.s)),{type:"walk",from:d.s,to:B,m:d.m}]);}
  }
  // score every pattern at the requested start time
  const walkAll=walkMin(direct);
  let pats=opts.map(legs=>timeLegs(legs,startMin)).filter(Boolean)
    .filter(r=>r.total<walkAll-2||walkAll>30);
  pats.forEach(r=>r.score=r.total+(r.rides.length>1?6:0)+r.walkTot*0.3);
  pats.sort((a,b)=>a.score-b.score);
  // keep distinct patterns: same lines boarded at the same station = same trip (only the best exit is kept)
  const seen=new Set(),best=[];
  for(const r of pats){const sig=r.rides.map(x=>x.line).join("+")+"@"+r.rides[0].from.i;if(seen.has(sig))continue;seen.add(sig);
    if(best.length&&r.score>best[0].score+15)break;best.push(r);if(best.length>=2)break;}
  // like Jakdojade: list the next departures of the best patterns
  const out=[];
  for(const p of best){let r=p;for(let k=0;k<(best.length>1?3:5)&&r;k++){out.push(r);const pre=r.legs[0].min+ACCESS_MIN;r=timeLegs(p.legs,r.firstDep-pre+1);}}
  if(direct<=2200){const m=walkMin(direct);out.push({legs:[{type:"walk",from:A,to:B,m:direct,start:startMin,min:m,end:startMin+m}],start:startMin,end:startMin+m,total:m,fare:0,firstDep:null,rides:[],walkTot:m});}
  out.sort((a,b)=>(a.firstDep??a.start)-(b.firstDep??b.start)||a.end-b.end);
  plan.best=best;plan.walk=out.find(r=>!r.rides.length)||null;

function cloneLegs(legs){return legs.map(l=>({...l}));}
function timeLegs(legsIn,startMin){
  const legs=cloneLegs(legsIn);let t=startMin,fare=0,firstDep=null;
  for(const lg of legs){

    else{const L=LINES[lg.line];t+=ACCESS_MIN;const off=Math.round(lg.dir>0?L.cumMin[lg.from.i]:L.cumMin[L.stops.length-1]-L.cumMin[lg.from.i]);const dep=nextDep(L,t,off);if(dep>L.close+off)return null; /* first/last trains leave the terminus at opening/closing time and reach this station off minutes later */
      lg.wait=dep-t;lg.dep=dep;lg.arr=dep+lg.min;t=lg.arr+1;fare+=lg.fare;if(firstDep===null)firstDep=dep;}
  }
  const rides=legs.filter(l=>l.type==="ride");
  return{legs,start:startMin,end:t,total:t-startMin,fare,firstDep,rides,walkTot:legs.filter(l=>l.type==="walk").reduce((a,l)=>a+l.min,0)};
}

function runSearch(){

  const closeAll=Math.max(LINES.OL.close,LINES.MB.close);let banner="";
  if(start<LINES.OL.open-30){banner=`Metro and Orange Line run from 06:00. Showing the first trips this morning.`;start=LINES.OL.open-15;state.future=true;}
  let list=plan(A,B,start);if(!list.some(r=>r.rides.length)&&start>=17*60){const m=plan(A,B,LINES.OL.open-15);if(m.some(r=>r.rides.length)){list=m;start=LINES.OL.open-15;state.future=true;banner="The last Metrobus and Orange Line trips for tonight have left. Showing the first trips tomorrow morning (from 06:00).";}}state.result=list;
  $("r-from").textContent=A.name;$("r-to").textContent=B.name;
  if(list.some(r=>r.rides.length))list=allDepartures(plan.best,plan.walk,start,start+480);state.result=list;state.shown=0;state.now=now;
  $("cards").innerHTML=`<div class="adband slim"><div class="lbl">AD</div><div class="adbox">Ad space · 320 × 100</div></div>`+(banner?`<div class="banner">${banner}</div>`:"")+(list.length?`<div id="cardlist"></div>`:`<p class="note" style="font-size:15px">No Metrobus or Orange Line trip fits this journey yet. Both points need to be within about 2.5 km of a station. Speedo and e-bus routes will widen this.</p>`)+
    `<p class="proto">Times are estimates from published frequencies. No live tracking yet.</p><div style="height:24px"></div>`;
  moreCards(16);$("cards").scrollTop=0;show("s-results");
}
function allDepartures(best,walk,start,until){ // each good pattern, departure after departure, until "until"
  const out=[];for(const p of best){let r=timeLegs(p.legs,start);let guard=0;
    while(r&&r.firstDep!==null&&r.firstDep<=until&&guard++<400){out.push(r);const pre=r.legs[0].min+ACCESS_MIN;r=timeLegs(p.legs,r.firstDep-pre+1);}}
  out.sort((a,b)=>a.firstDep-b.firstDep||a.end-b.end);
  const ded=[];for(const r of out){const q=ded[ded.length-1];if(q&&q.firstDep===r.firstDep&&q.end<=r.end&&q.rides.map(x=>x.line).join()===r.rides.map(x=>x.line).join())continue;ded.push(r);}
  if(walk)ded.unshift(walk);return ded;}
function moreCards(n=14){const list=state.result,box=$("cardlist");if(!box||state.shown>=list.length)return;
  const end=Math.min(list.length,state.shown+n);let h="";for(let k=state.shown;k<end;k++)h+=cardHTML(list[k],k,state.now,state.future);
  box.insertAdjacentHTML("beforeend",h);state.shown=end;}

function depHTML(r,now,future){

  const inMin=r.firstDep-now;
  return(!future&&inMin<=59)?`<small>Departs in:</small><b class="tnum">${String(Math.max(0,inMin)).padStart(2,"0")}<i>min</i></b>`:`<small>Departs at</small><b class="tnum">${fmt(r.firstDep)}</b>`;}

function legsChips(r){

  if(on&&now-adState.topSeenAt<AD_REST)return;b.classList.toggle("adhide",!on);adState.lock=now+450;if(!on)adState.topSeenAt=now;}
(function(){let last=0,ty=null;const sc=$("detail");
  sc.addEventListener("scroll",()=>{const top=sc.scrollTop,d=top-last;last=top;if(Date.now()<adState.lock)return; // ignore the jolt our own resize causes
    if(d<-16)topAd(true);else if(d>8)topAd(false);},{passive:true});
  sc.addEventListener("touchstart",e=>{ty=e.touches[0].clientY;},{passive:true});
  sc.addEventListener("touchmove",e=>{if(ty===null||Date.now()<adState.lock)return;const dy=e.touches[0].clientY-ty;
    if(sc.scrollTop<=0&&dy>40){topAd(true);ty=null;}},{passive:true});
})();

// lift the "lights off" dark style to a brighter night palette (slate land, blue water, green parks, readable roads)
function recolor(l){const id=l.id.toLowerCase(),p=l.paint=l.paint||{},has=(...w)=>w.some(x=>id.includes(x));
  if(l.type==="background"){p["background-color"]="#2a3242";return;}
  if(l.type==="fill"){
    if(has("water","ocean","lake","river"))p["fill-color"]="#1f4277";
    else if(has("park","wood","grass","forest","garden","cemetery","pitch","landcover","nature","scrub","farm"))p["fill-color"]="#245c4c";
    else if(has("building"))p["fill-color"]="#3b4559";
    else if(has("aeroway","airport"))p["fill-color"]="#34405a";
    else if(has("pier","road_area"))p["fill-color"]="#3a4458";
    else if(has("landuse","residential","industrial","commercial","school","hospital"))p["fill-color"]="#30394b";
    return;}
  if(l.type==="line"){
    if(has("water","river","canal","stream"))p["line-color"]="#2f64ad";
    else if(has("casing"))p["line-color"]="#222a37";
    else if(has("rail","transit"))p["line-color"]="#56617a";
    else if(has("aeroway","runway","taxiway"))p["line-color"]="#4a556b";
    else if(has("motorway","trunk","primary"))p["line-color"]="#93a0b8";
    else if(has("secondary","tertiary"))p["line-color"]="#7a879e";
    else if(has("road","highway","street","minor","service","path","track","bridge","tunnel","transportation"))p["line-color"]="#5d6880";
    else if(has("boundary","admin"))p["line-color"]="#6a7488";
    return;}
  if(l.type==="symbol"&&l.layout&&l.layout["text-field"]){
    p["text-color"]=has("water","ocean","sea","lake","river")?"#9cc2f2":has("road","highway","street","transportation")?"#c3cad7":"#eef1f6";
    p["text-halo-color"]="#1c2330";p["text-halo-width"]=1.2;}}
function engStyle(){ // OpenFreeMap dark style, labels forced to English → Latin transliteration → local
  if(!styleP)styleP=fetch("https://tiles.openfreemap.org/styles/dark").then(r=>r.json()).then(st=>{
    const N=["coalesce",["get","name:en"],["get","name_en"],["get","name:latin"],["get","name"]];
    const fixDef=v=>["case",["in","Defense",v],["concat",["slice",v,0,["index-of","Defense",v]],"Defence",["slice",v,["+",["index-of","Defense",v],7]]],v];
    const tf=["let","a",["to-string",N],["let","b",fixDef(["var","a"]),
      ["case",["all",[">=",["length",["var","b"]],5],["==",["slice",["var","b"],["-",["length",["var","b"]],5]]," Cant"]],["concat",["var","b"],"t"],["var","b"]]]];
    st.layers.forEach(l=>{if(l.layout&&l.layout["text-field"]&&l.id.indexOf("shield")<0&&l.id.indexOf("housenumber")<0)l.layout["text-field"]=tf;recolor(l);});return st;});
  return styleP;}
function esriBase(m){const E="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  L.tileLayer(E+"World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:16}).addTo(m);
  L.tileLayer(E+"World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:16}).addTo(m);}
function makeMap(id){const m=L.map(id,{zoomControl:false,attributionControl:false,maxZoom:19,zoomSnap:0,zoomDelta:1,wheelPxPerZoomLevel:90,preferCanvas:true,renderer:L.canvas({padding:0.3,tolerance:6})}).setView([31.52,74.33],12);
  const cr=L.control({position:"topleft"});cr.onAdd=()=>{const d=L.DomUtil.create("button","credit");d.textContent="© OpenStreetMap";L.DomEvent.disableClickPropagation(d);
    d.onclick=()=>toast("Map data © OpenStreetMap contributors · map style © OpenMapTiles · tiles by OpenFreeMap");return d;};cr.addTo(m);
  let ok=false;
  try{if(window.maplibregl&&L.maplibreGL&&!!document.createElement("canvas").getContext("webgl")){
      engStyle().then(st=>{L.maplibreGL({style:st,interactive:false,attributionControl:false}).addTo(m);m.getPane("overlayPane").style.zIndex=450;}).catch(()=>esriBase(m));ok=true;}}catch(e){}
  if(!ok)esriBase(m);
  dblTap(m);return m;}
function dblTap(m){ // double-tap = zoom in; double-tap-hold-and-drag = smooth one-finger zoom (like Apple/Google Maps)
  const el=m.getContainer();let last=0,lx=0,ly=0,qz=null,raf=0,nz=0;
  const pt=t=>{const r=el.getBoundingClientRect();return L.point(t.clientX-r.left,t.clientY-r.top);};
  el.addEventListener("touchstart",e=>{if(e.touches.length!==1){qz=null;last=0;return;}const t=e.touches[0],now=Date.now();
    if(now-last<320&&Math.hypot(t.clientX-lx,t.clientY-ly)<40){m.doubleClickZoom.disable();m.dragging.disable();
      qz={y0:t.clientY,z0:m.getZoom(),c:m.containerPointToLatLng(pt(t)),moved:false};e.preventDefault();}
  },{passive:false});
  el.addEventListener("touchmove",e=>{if(!qz)return;e.preventDefault();const dy=e.touches[0].clientY-qz.y0;if(Math.abs(dy)>6)qz.moved=true;
    nz=Math.max(m.getMinZoom(),Math.min(m.getMaxZoom(),qz.z0+dy/110));
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(qz)m.setZoomAround(qz.c,nz,{animate:false});});},{passive:false});
  el.addEventListener("touchend",e=>{const t=e.changedTouches[0];
    if(qz){const q=qz;qz=null;cancelAnimationFrame(raf);raf=0;m.dragging.enable();last=0;if(!q.moved)m.setZoomAround(q.c,m.getZoom()+1);return;}
    if(e.touches.length)return;last=Date.now();lx=t.clientX;ly=t.clientY;},{passive:true});
  el.addEventListener("touchcancel",()=>{if(qz){qz=null;m.dragging.enable();}},{passive:true});}
function initMap(){if(lmap)return;lmap=makeMap("lmap");layer=L.layerGroup().addTo(lmap);lmap.on("click",onMapClick);}
function initDmap(){if(dmap)return;dmap=makeMap("dmap");dlayer=L.layerGroup().addTo(dmap);let r=0;new ResizeObserver(()=>{if(!r)r=requestAnimationFrame(()=>{r=0;dmap.invalidateSize({pan:false});});}).observe($("dmap"));}
function fitTrip(){const pts=[state.from,state.to];state.trip.rides.forEach(r=>pts.push(...r.stops));dmap.fitBounds(L.latLngBounds(pts.map(ll)),{paddingTopLeft:[34,44],paddingBottomRight:[124,44]});}
function pinIcon(label,col){return L.divIcon({className:"",iconSize:[0,0],html:`<div style="position:relative"><div class="pinlbl">${label}</div><div style="position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid ${col};box-sizing:border-box"></div></div>`});}
const walkCache=new Map();
async function walkPath(a,b){ // real footpath from OSM routing (free demo server); straight line if unavailable
  const k=[a.lat,a.lng,b.lat,b.lng].map(v=>v.toFixed(5)).join(",");if(walkCache.has(k))return walkCache.get(k);
  try{const u=`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const j=await(await fetch(u)).json();if(j.routes&&j.routes[0]){const w={pts:j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]])};walkCache.set(k,w);return w;}}catch(e){}
  return{pts:[ll(a),ll(b)]};}
function drawInto(lay,mode){
  lay.clearLayers();
  const trip=mode==="trip"?state.trip:null;const dim=trip?0.28:1;
  for(const Ln of Object.values(LINES))L.polyline(Ln.geom,{color:Ln.color,weight:5,opacity:dim}).addTo(lay);
  if(trip)for(const l of trip.legs){
    if(l.type==="ride")L.polyline(trackBetween(l.line,l.from,l.to),{color:LINES[l.line].color,weight:8,opacity:1,lineCap:"round",lineJoin:"round"}).addTo(lay);
    else if(l.m>=40){const line=L.polyline([ll(l.from),ll(l.to)],{color:"#c8ced4",weight:6,dashArray:"1 11",lineCap:"round"}).addTo(lay);walkPath(l.from,l.to).then(w=>line.setLatLngs(w.pts));}
  }
  for(const s of STATIONS){const on=trip&&trip.rides.some(r=>r.stops.includes(s));const vis=!trip||on;const end=trip&&trip.rides.some(r=>r.from===s||r.to===s);
    const m=L.circleMarker(ll(s),{radius:end?8:on?6:5,color:LINES[s.line].color,weight:end?4:3,fillColor:end?"#fff":"#141619",fillOpacity:1,opacity:vis?1:dim}).addTo(lay);
    // names of boarding / exit / change stations stay on screen only when zoomed in, and never when they repeat the Start/End point
    const nearPin=trip&&[state.from,state.to].some(p=>p&&dist(p,s)<250);
    m.bindTooltip(s.name+(s.under?" (underground)":""),{direction:"right",className:end&&!nearPin?"st-label perm":"st-label",permanent:!!end&&!nearPin});}
  const mp=lay._map;if(mp&&!mp._lblHook){mp._lblHook=true;const f=()=>mp.getContainer().classList.toggle("lbl-hide",mp.getZoom()<15);mp.on("zoomend",f);f();}
  if(trip){
    trip.rides.forEach((r,k)=>{const Ln=LINES[r.line],mid=r.stops[Math.floor((r.stops.length-1)/2)],nx=r.stops[Math.min(r.stops.length-1,Math.floor((r.stops.length-1)/2)+1)];
      const at=[(mid.lat+nx.lat)/2,(mid.lng+nx.lng)/2];
      L.marker(at,{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="rchip" style="background:${Ln.color};color:${r.line==="OL"?"#2a1400":"#fff"}">${modeSvg(r.line)}${Ln.short}</div>`})}).addTo(lay);
      if(k>0){const a=trip.rides[k-1].to,b=r.from;L.marker([(a.lat+b.lat)/2,(a.lng+b.lng)/2],{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="xfer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg></div>`})}).addTo(lay);}});
    L.marker(ll(state.from),{icon:pinIcon("Start","#1fc77e")}).addTo(lay);L.marker(ll(state.to),{icon:pinIcon("End","#1f9ee0")}).addTo(lay);}
  if(mode==="pick"&&state.pickPt)L.marker(ll(state.pickPt),{icon:pinIcon(state.picking==="from"?"Start":"End",state.picking==="from"?"#1fc77e":"#1f9ee0")}).addTo(lay);
}
function openMap(mode){state.mapMode=mode;initMap();$("nav2").hidden=mode==="pick";$("map-back").style.visibility=mode==="pick"?"visible":"hidden";
  show("s-map",false,mode==="network");$("pickbar").hidden=mode!=="pick";$("legend").hidden=mode==="pick";$("mapctl").style.bottom=mode==="pick"?"96px":"";
  $("map-title").textContent=mode==="pick"?(state.picking==="from"?"Choose start":"Choose destination"):"Network map";

async function reverseName(p){
  try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${p.lat}&lon=${p.lng}`)).json();
    const a=j.address||{};const parts=[j.name,a.road,a.neighbourhood||a.suburb||a.quarter].filter(Boolean);return parts.slice(0,2).join(", ")||"Pinned point";}catch(e){return "Pinned point";}}
async function onMapClick(e){if(state.mapMode!=="pick")return;const p={lat:e.latlng.lat,lng:e.latlng.lng,name:"Pinned point"};
  state.pickPt=p;drawInto(layer,"pick");$("pick-ok").disabled=false;$("pick-txt").textContent="Finding the address…";
  const near=STATIONS.map(s=>({s,d:dist(p,s)})).sort((a,b)=>a.d-b.d)[0];
  const nm=await reverseName(p);if(state.pickPt!==p)return;p.name=nm;
  $("pick-txt").textContent=nm+" · "+(near.d<1000?Math.round(near.d)+" m":(near.d/1000).toFixed(1)+" km")+" to "+near.s.name;}

function locateMe(cb){
  if(!navigator.geolocation){cb(null,"This browser can't share your location.");return;}
  navigator.geolocation.getCurrentPosition(pos=>cb({lat:pos.coords.latitude,lng:pos.coords.longitude,name:"My location"}),
    err=>cb(null,err.code===1?"Location is blocked. Allow it in your browser settings, or select on the map.":"Couldn't get your location. Try again, or select on the map."),{enableHighAccuracy:true,timeout:12000});}
$("locate").onclick=()=>locateMe((p,msg)=>{if(!p){toast(msg);return;}state.lastPos={lat:p.lat,lng:p.lng};

  if(state.mapMode==="pick"){state.pickPt=p;drawInto(layer,"pick");$("pick-ok").disabled=false;$("pick-txt").textContent="My location";}});

const curScreen=()=>document.querySelector(".screen.on").id;
const atRoot=()=>curScreen()==="s-home"&&!$("tabtrack").classList.contains("t2");
function backTarget(){const c=curScreen();
  if(c==="s-search"||c==="s-results")return"s-home";
  if(c==="s-detail")return $("s-detail").classList.contains("open")?null:"s-results";
  if(c==="s-map")return state.mapMode==="pick"?"s-search":"s-home";return null;}

  if(c==="s-home"){if($("tabtrack").classList.contains("t2"))setTab("trip");syncBack();return;}

let backEntry=false,skipPop=false;
function syncBack(){const root=atRoot()&&!$("s-detail").classList.contains("open");

  else if(root&&backEntry){backEntry=false;skipPop=true;history.back();}}

// home-screen app (no browser bar): our own swipe from the left edge
(function(){const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;if(!standalone)return;

  ph.addEventListener("touchstart",e=>{if(e.touches.length!==1||atRoot())return;const r=ph.getBoundingClientRect(),t=e.touches[0];
    if(t.clientX-r.left>26)return;x0=t.clientX;y0=t.clientY;dx=0;drag=false;},{passive:true});
