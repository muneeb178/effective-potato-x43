<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lahore Transit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: Jakdojade-style night UI. Phone-first column, card list + vertical timeline. */
  --bg:#141619; --surface:#1f2226; --surface-2:#2a2e33; --line:#33383e;
  --text:#f2f4f5; --muted:#9aa1a8; --accent:#1fc77e; --blue:#1f9ee0;
  --ol:#f28c28; --mb:#d6262e; --walk:#c8ced4;
  --font:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0c0e;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:21px;letter-spacing:-.2px}
.pill{background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.iconbtn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2)}

/* tabs */
.tabs{display:flex;border-bottom:3px solid var(--surface-2);margin:0 0 14px}
.tab{flex:1;padding:12px 0 12px;font-weight:600;font-size:17px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--text)}

/* search fields */
.fields{padding:0 16px;display:grid;gap:10px;position:relative}
.field{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:12px;padding:15px 16px;text-align:left;width:100%;min-height:54px}
.field .ph{color:var(--muted);font-size:18px}
.field .val{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:4px solid var(--accent);background:var(--bg)}
.dot.b{border-color:var(--blue)}
.swap{position:absolute;right:28px;top:39px;width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;border:2px solid var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.chip{background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center}
.go{background:var(--accent);color:#06200f;font-weight:700;border-radius:999px;padding:11px 20px;font-size:16px}
.go:disabled{opacity:.35}

.sheet{margin-top:14px;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 0 24px;flex:1}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:24px;font-weight:700;padding:4px 20px 6px;letter-spacing:-.3px}
.hist{display:block;width:100%;text-align:left;padding:12px 20px;border-bottom:1px solid var(--line)}
.hist:hover{background:var(--surface-2)}
.hist .l{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;line-height:1.35}
.hist .arr{color:var(--muted);font-size:13px;padding-left:4px}
.note{color:var(--muted);font-size:13px;padding:14px 20px;line-height:1.45}

/* bottom nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:8px 0 14px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.nav button.on{color:var(--text)}

/* search screen */
.sbar{display:flex;gap:10px;align-items:center;padding:14px 12px 10px}
.sbar input{flex:1;background:var(--surface);border:0;border-radius:12px;padding:15px 16px;color:var(--text);font:inherit;font-size:17px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 18px;border-bottom:1px solid var(--surface-2)}
.opt:hover{background:var(--surface)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.opt .t{font-size:16px;font-weight:600}
.opt .s{font-size:13px;color:var(--muted);margin-top:2px}

/* results */
.rhead{display:flex;gap:12px;padding:16px 16px 14px;align-items:center;border-bottom:1px solid var(--line)}
.rhead .ft{flex:1;display:grid;grid-template-columns:18px 1fr;gap:6px 12px;align-items:center;font-size:17px;font-weight:600;min-width:0}
.rhead .ft div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .vline{grid-row:1/3;align-self:stretch;display:flex;flex-direction:column;align-items:center}
.card{display:block;width:calc(100% - 24px);margin:12px;background:var(--surface);border-radius:16px;padding:16px 16px 14px;text-align:left}
.card:hover{background:#25292e}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dep small{display:block;font-size:14px;color:var(--muted);font-weight:500}
.dep b{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.dep b i{font-style:normal;font-size:18px;font-weight:700;letter-spacing:0;margin-left:2px}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{border-radius:6px;padding:3px 8px;font-weight:800;font-size:14px;color:#fff;display:inline-flex;align-items:center;gap:5px}
.badge.ol{background:var(--ol);color:#2a1400}
.badge.mb{background:var(--mb)}
.tot{color:var(--muted);font-size:15px;font-weight:600;text-align:right;margin-top:6px}
.legs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 7px;margin-top:12px;font-size:14px;color:var(--muted)}
.t-g{background:var(--accent);color:#06200f;font-weight:700;border-radius:999px;padding:2px 9px}
.t-b{background:var(--blue);color:#021623;font-weight:700;border-radius:999px;padding:2px 9px}
.fare{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.fare b{color:var(--text)}
.banner{margin:12px;padding:12px 14px;border-radius:12px;background:#3a2a10;color:#ffd391;font-size:14px;line-height:1.45}

/* detail */
.dsum{padding:4px 18px 16px;border-bottom:1px solid var(--line)}
.tl{position:relative;padding:8px 0 30px}
.st{display:grid;grid-template-columns:86px 1fr;gap:0 12px;padding:0 18px}
.st .c{display:flex;flex-direction:column;align-items:center}
.st .b{padding:6px 0 14px;min-width:0}
.time{border-radius:999px;font-weight:700;padding:4px 10px;font-size:15px;background:var(--surface-2)}
.time.g{background:var(--accent);color:#06200f}
.time.bl{background:var(--blue);color:#021623}
.vbar{width:6px;flex:1;min-height:20px;border-radius:3px}
.vdots{flex:1;min-height:30px;width:6px;background:radial-gradient(circle,var(--muted) 2.5px,transparent 3px) center/6px 13px repeat-y}
.circ{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;margin:6px 0}
.sname{font-size:19px;font-weight:700;line-height:1.25}
.sub{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.4}
.ride{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px}
.ride .dur{margin-left:auto;color:var(--muted)}
.freq{font-size:15px;margin-top:8px}
.tog{display:flex;justify-content:space-between;width:100%;padding:12px 0 4px;margin-top:10px;border-top:1px solid var(--line);font-size:16px;font-weight:600}
.mid{display:grid;grid-template-columns:86px 1fr;gap:0 12px;padding:0 18px}
.mid .c{display:flex;justify-content:center}
.mid .b{display:flex;gap:10px;padding:9px 0;font-size:15px;color:#d5dade}
.mid .b .tt{color:var(--muted);width:44px;flex:none}
.walk{display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:12px 0}
.walk span:last-child{color:var(--muted);white-space:nowrap;padding-left:10px}
.footer{display:flex;gap:10px;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--bg)}
.btn{flex:1;background:#f2f4f5;color:#121417;border-radius:14px;padding:14px;font-weight:700;font-size:16px;display:flex;justify-content:center;gap:8px;align-items:center}
.btn.dark{background:var(--surface-2);color:var(--text)}

/* map */
.mapwrap{position:relative;flex:1;overflow:hidden;background:#1a1d21;touch-action:none}
.mapctl{position:absolute;left:14px;bottom:18px;display:grid;gap:10px}
.mapctl button{width:46px;height:46px;border-radius:50%;background:#26292e;font-size:22px;font-weight:700;box-shadow:0 2px 10px #0007}
.legend{position:absolute;right:12px;top:12px;background:#000a;border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px}
.pickbar{position:absolute;left:12px;right:12px;bottom:18px;background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px #000a}
.pickbar[hidden]{display:none}
.pickbar .txt{flex:1;font-size:14px;color:var(--muted)}
#lmap{position:absolute;inset:0;background:#1a1d21}
#lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-container{font-family:var(--font);background:#1a1d21}
.leaflet-control-attribution{background:#000a!important;color:#9aa1a8!important;font-size:10px}
.leaflet-control-attribution a{color:#c8ced4!important}
.leaflet-tooltip.st-label{background:#141619e6;border:0;color:#e6e9ec;font-weight:600;font-size:12px;padding:2px 6px;border-radius:6px;box-shadow:none}
.leaflet-tooltip.st-label::before{display:none}
.pinlbl{background:#f2f4f5;color:#121417;font-weight:700;font-size:13px;padding:3px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-150%);display:inline-block}
.loading{padding:14px 18px;color:var(--muted);font-size:14px}
.proto{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 0}
@media (prefers-reduced-motion:no-preference){.screen.on{animation:fade .16s ease-out}@keyframes fade{from{opacity:.6}to{opacity:1}}}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="phone" id="phone">

<!-- HOME -->
<section class="screen on" id="s-home">
  <div class="hdr">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="7" cy="22" r="3.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="23" cy="7" r="3.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M9.5 19.5 C14 15, 16 14, 20.5 9.5" stroke="#1fc77e" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <span>Lahore Transit</span>
    </div>
    <span class="pill tnum" id="clock">--:--</span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" aria-selected="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21l2-3M16 21l-2-3"/><circle cx="8" cy="14.5" r="1" fill="currentColor"/><circle cx="16" cy="14.5" r="1" fill="currentColor"/></svg>
      Lahore
    </button>
    <button class="tab" role="tab" aria-selected="false" id="tab-lines">Lines</button>
  </div>
  <div class="fields">
    <button class="field" id="f-from"><span class="dot"></span><span class="ph" id="from-txt">From where?</span></button>
    <button class="field" id="f-to"><span class="dot b"></span><span class="ph" id="to-txt">Where to?</span></button>
    <button class="swap" id="swap" aria-label="Swap start and destination"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button>
  </div>
  <div class="row">
    <span class="chip tnum" id="when">Leave now</span>
    <button class="go" id="go" disabled>Find routes</button>
  </div>
  <div class="sheet scroll">
    <div class="grab"></div>
    <h2>Recent trips</h2>
    <div id="hist"></div>
    <p class="note">Prototype covers the Metrobus (27 stations) and Orange Line (26 stations), with the walking transfer at Anarkali / MAO College. Speedo feeders and e-buses come next.</p>
  </div>
  <nav class="nav">
    <button class="on"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 2 12l10 10 10-10Zm1 13v-3H9v3H7v-4a1 1 0 0 1 1-1h5V7l4 4Z"/></svg>Trip</button>
    <button id="nav-lines"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Lines</button>
    <button id="nav-map"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  </nav>
</section>

<!-- SEARCH -->
<section class="screen" id="s-search">
  <div class="sbar">
    <button class="iconbtn" id="search-back" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg></button>
    <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Search</label>
    <input id="q" autocomplete="off" placeholder="Station, place or address">
  </div>
  <div class="scroll" id="opts"></div>
</section>

<!-- RESULTS -->
<section class="screen" id="s-results">
  <div class="hdr" style="padding-bottom:4px">
    <button class="iconbtn" id="res-back" aria-label="Back"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <span class="pill tnum" id="res-clock"></span>
  </div>
  <div class="rhead">
    <div class="ft">
      <span class="vline"><span class="dot" style="width:18px;height:18px"></span><span style="flex:1;width:3px;background:var(--accent);min-height:14px"></span><span class="dot b" style="width:18px;height:18px"></span></span>
      <div id="r-from"></div><div id="r-to"></div>
    </div>
  </div>
  <div class="scroll" id="cards"></div>
</section>

<!-- DETAIL -->
<section class="screen" id="s-detail">
  <div class="hdr" style="padding-bottom:4px">
    <button class="iconbtn" id="det-back" aria-label="Back"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <span class="pill tnum" id="det-fare"></span>
  </div>
  <div class="scroll" id="detail"></div>
  <div class="footer">
    <button class="btn dark" id="det-map"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>Show on map</button>
    <button class="btn" id="det-nav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m12 2 8 10-8 10-8-10Z"/><path d="M10 13v-2h4l-2-2"/></svg>Navigate</button>
  </div>
</section>

<!-- MAP -->
<section class="screen" id="s-map">
  <div class="hdr" style="padding-bottom:8px">
    <button class="iconbtn" id="map-back" aria-label="Back"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <span style="font-weight:700;font-size:18px" id="map-title">Network map</span>
    <span style="width:40px"></span>
  </div>
  <div class="mapwrap" id="mapwrap">
    <div id="lmap"></div>
    <div class="legend" style="z-index:500"><span><i style="background:var(--ol)"></i>Orange Line</span><span><i style="background:var(--mb)"></i>Metrobus</span><span><i style="background:repeating-linear-gradient(90deg,#c8ced4 0 3px,transparent 3px 6px)"></i>Walk</span></div>
    <div class="mapctl" id="mapctl" style="z-index:500"><button id="locate" aria-label="Show my location"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="#fff"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
    <div class="pickbar" id="pickbar" hidden style="z-index:500"><span class="txt" id="pick-txt">Tap the map to set the point</span><button class="go" id="pick-ok" disabled>Use this point</button></div>
  </div>
</section>

<!-- LINES -->
<section class="screen" id="s-lines">
  <div class="hdr" style="padding-bottom:8px">
    <button class="iconbtn" id="lines-back" aria-label="Back"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <span style="font-weight:700;font-size:18px">Lines</span><span style="width:40px"></span>
  </div>
  <div class="scroll" id="lines"></div>
</section>
</div>

<script>

// ---------------------------------------------------------------- GEOMETRY
const R=6371000, rad=x=>x*Math.PI/180;
function dist(a,b){const dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng);const h=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const WALK_DETOUR=1.3, WALK_MPM=80; // street detour factor, 80 m per minute (4.8 km/h)
const walkM=(a,b)=>dist(a,b)*WALK_DETOUR;
const walkMin=m=>Math.max(1,Math.round(m/WALK_MPM));

// build stations
const STATIONS=[];
for(const L of Object.values(LINES)){
  L.stops=L.st.map(([name,lat,lng],i)=>{const s={id:L.id+":"+i,name,lat,lng,line:L.id,i,under:L.underground.includes(name)};STATIONS.push(s);return s;});
  // cumulative km + minutes
  L.cumKm=[0];L.cumMin=[0];
  if(L.id==="MB"){for(let i=1;i<L.stops.length;i++){L.cumKm[i]=L.cumKm[i-1]+L.km[i];L.cumMin[i]=L.cumKm[i]/L.speedKmh*60;}}
  else{let tot=0;const seg=[0];for(let i=1;i<L.stops.length;i++){const d=dist(L.stops[i-1],L.stops[i])/1000;seg.push(d);tot+=d;}
    for(let i=1;i<L.stops.length;i++){L.cumKm[i]=L.cumKm[i-1]+seg[i]*L.trackKm/tot;L.cumMin[i]=L.cumKm[i]/L.trackKm*L.fullMin;}}
}
const ACCESS_MIN=2; // stairs / security / token at elevated & underground stations
// transfers between lines: walk <= 900 m
const TRANSFERS=[];
for(const a of LINES.OL.stops)for(const b of LINES.MB.stops){const m=walkM(a,b);if(m<=900){TRANSFERS.push({a,b,m});TRANSFERS.push({a:b,b:a,m});}}

function fareFor(lineId,i,j){const L=LINES[lineId];if(lineId==="MB")return MB_FARE;const km=Math.abs(L.cumKm[j]-L.cumKm[i]);for(const[max,f]of OL_FARE)if(km<=max)return f;return 45;}
function rideMin(lineId,i,j){const L=LINES[lineId];return Math.max(2,Math.round(Math.abs(L.cumMin[j]-L.cumMin[i])));}
function nextDep(L,t){ // minutes since midnight; departures on a fixed grid from opening
  if(t<L.open)return L.open; const k=Math.ceil((t-L.open)/L.headway);return L.open+k*L.headway;}

// ---------------------------------------------------------------- ROUTER
const MAX_ACCESS_WALK=2600; // m (walk-distance incl. detour)
function nearest(p,line,n){return LINES[line].stops.map(s=>({s,m:walkM(p,s)})).filter(x=>x.m<=MAX_ACCESS_WALK).sort((x,y)=>x.m-y.m).slice(0,n);}
function legRide(lineId,from,to){const dir=to.i>from.i?1:-1;const L=LINES[lineId];return{type:"ride",line:lineId,from,to,stops:L.stops.slice(Math.min(from.i,to.i),Math.max(from.i,to.i)+1)[dir>0?"slice":"reverse"]().slice(),dir,headsign:dir>0?L.stops[L.stops.length-1].name:L.stops[0].name,min:rideMin(lineId,from.i,to.i),fare:fareFor(lineId,from.i,to.i)};}
function fixStops(leg){const L=LINES[leg.line];const a=Math.min(leg.from.i,leg.to.i),b=Math.max(leg.from.i,leg.to.i);let s=L.stops.slice(a,b+1);if(leg.dir<0)s=s.reverse();leg.stops=s;return leg;}

function plan(A,B,startMin){
  const opts=[];
  const direct=walkM(A,B);
  for(const line of ["OL","MB"]){
    for(const o of nearest(A,line,3))for(const d of nearest(B,line,3)){if(o.s.i===d.s.i)continue;
      opts.push([{type:"walk",from:A,to:o.s,m:o.m},fixStops(legRide(line,o.s,d.s)),{type:"walk",from:d.s,to:B,m:d.m}]);}
  }
  for(const tr of TRANSFERS){const l1=tr.a.line,l2=tr.b.line;
    for(const o of nearest(A,l1,3))for(const d of nearest(B,l2,3)){if(o.s.i===tr.a.i||d.s.i===tr.b.i)continue;
      opts.push([{type:"walk",from:A,to:o.s,m:o.m},fixStops(legRide(l1,o.s,tr.a)),{type:"walk",from:tr.a,to:tr.b,m:tr.m,transfer:true},fixStops(legRide(l2,tr.b,d.s)),{type:"walk",from:d.s,to:B,m:d.m}]);}
  }
  // score every pattern at the requested start time
  const walkAll=walkMin(direct);
  let pats=opts.map(legs=>timeLegs(legs,startMin)).filter(Boolean)
    .filter(r=>r.total<walkAll-2||walkAll>30);
  pats.forEach(r=>r.score=r.total+(r.rides.length>1?6:0)+r.walkTot*0.3);
  pats.sort((a,b)=>a.score-b.score);
  // keep distinct patterns: same lines boarded at the same station = same trip (only the best exit is kept)
  const seen=new Set(),best=[];
  for(const r of pats){const sig=r.rides.map(x=>x.line).join("+")+"@"+r.rides[0].from.i;if(seen.has(sig))continue;seen.add(sig);
    if(best.length&&r.score>best[0].score+15)break;best.push(r);if(best.length>=2)break;}
  // like Jakdojade: list the next departures of the best patterns
  const out=[];
  for(const p of best){let r=p;for(let k=0;k<(best.length>1?3:5)&&r;k++){out.push(r);const pre=r.legs[0].min+ACCESS_MIN;r=timeLegs(p.legs,r.firstDep-pre+1);}}
  if(direct<=2200){const m=walkMin(direct);out.push({legs:[{type:"walk",from:A,to:B,m:direct,start:startMin,min:m,end:startMin+m}],start:startMin,end:startMin+m,total:m,fare:0,firstDep:null,rides:[],walkTot:m});}
  out.sort((a,b)=>(a.firstDep??a.start)-(b.firstDep??b.start)||a.end-b.end);
  return out;
}
function cloneLegs(legs){return legs.map(l=>({...l}));}
function timeLegs(legsIn,startMin){
  const legs=cloneLegs(legsIn);let t=startMin,fare=0,firstDep=null;
  for(const lg of legs){
    if(lg.type==="walk"){lg.start=t;lg.min=lg.m<40?0:walkMin(lg.m);t+=lg.min;lg.end=t;}
    else{const L=LINES[lg.line];t+=ACCESS_MIN;const dep=nextDep(L,t);if(dep+lg.min>L.close)return null;
      lg.wait=dep-t;lg.dep=dep;lg.arr=dep+lg.min;t=lg.arr+1;fare+=lg.fare;if(firstDep===null)firstDep=dep;}
  }
  const rides=legs.filter(l=>l.type==="ride");
  return{legs,start:startMin,end:t,total:t-startMin,fare,firstDep,rides,walkTot:legs.filter(l=>l.type==="walk").reduce((a,l)=>a+l.min,0)};
}

function runSearch(){

  if(start>=closeAll-10||start<LINES.OL.open-30){banner=`Metro and Orange Line run 06:00 to 22:00. Showing the first trips tomorrow morning.`;start=LINES.OL.open-15;}
  const list=plan(A,B,start);
  state.result=list;state.start=start;
  $("r-from").textContent=A.name;$("r-to").textContent=B.name;
  const now=nowMin();
  $("cards").innerHTML=(banner?`<div class="banner">${banner}</div>`:"")+(list.length?list.map((r,k)=>cardHTML(r,k,now,!!banner)).join(""):`<p class="note" style="font-size:15px">No Metrobus or Orange Line trip fits this journey yet. Both points need to be within about 2.5 km of a station. Speedo and e-bus routes will widen this.</p>`)+

    if(l.type==="walk"){ if(!l.min)return;
      const label=l.transfer?`Change: walk ${Math.round(l.m)} m to ${LINES[l.to.line].name}`:`Walk ${Math.round(l.m)} m`;
      h+=row(walkIcon+`<span class="vdots"></span>`,`<div class="walk"><span>${label}</span><span>${l.min} min</span></div>${l.transfer&&(l.from.under||l.to.under)?`<div class="sub">Anarkali is underground: go up to street level, then up to the Metrobus platform.</div>`:""}`,true);
    }else{
      const L=LINES[l.line];
      const stairs=l.from.under?"Go down to the platform (underground station).":"Take the stairs or escalator up to the platform.";
      h+=row(`<span class="time g tnum">${fmt(l.dep)}</span>`+circleIcon(l.line)+`<span class="vbar" style="background:${L.color}"></span>`,
        `<div class="sname">${l.from.name}</div><div class="sub">${stairs}</div>
         <div class="ride"><span class="badge ${L.cls}">${L.short}</span><span>→ ${l.headsign.toUpperCase()}</span><span class="dur tnum">${l.min} min</span></div>
         <div class="freq">Departures every about ${L.headway} min</div>
         <button class="tog" data-tog="${idx}"><span>${l.stops.length-2>0?(l.stops.length-1)+" stops":"1 stop"}</span><span>⌄</span></button>
         <div id="mid-${idx}" hidden></div>`,true);
      // intermediate
      const mids=l.stops.slice(1,-1).map(s=>{const t=l.dep+Math.round(Math.abs(LINES[l.line].cumMin[s.i]-LINES[l.line].cumMin[l.from.i]));return `<div class="mid"><div class="c"><span class="vbar" style="background:${L.color};min-height:38px"></span></div><div class="b"><span class="tt tnum">${fmt(t)}</span><span>${s.name}</span></div></div>`;}).join("");
      h+=`<div id="midrows-${idx}" hidden>${mids}</div>`;
      h+=row(`<span class="vbar" style="background:${L.color};max-height:24px"></span><span class="time bl tnum">${fmt(l.arr)}</span>`,`<div class="sname">${l.to.name}</div><div class="sub">Get off here${l.to.under?" · underground station":""}.</div>`);
    }
  });
  h+=row(`<span class="time tnum">${fmt(r.end)}</span>`,`<div class="sname">${state.to.name}</div><div class="sub">Arrive · fare Rs ${r.fare}${r.rides.length>1?" (two tickets)":""}</div>`);
  h+=`</div>`;
  $("detail").innerHTML=h;
}
function row(c,b,tall){return `<div class="st"><div class="c">${c}</div><div class="b">${b}</div></div>`;}
$("detail").onclick=e=>{const t=e.target.closest(".tog");if(!t)return;const el=$("midrows-"+t.dataset.tog);el.hidden=!el.hidden;t.lastElementChild.textContent=el.hidden?"⌄":"⌃";};
$("det-back").onclick=()=>show("s-results");
$("det-map").onclick=()=>openMap("trip");
$("det-nav").onclick=()=>openMap("trip");

// ---------------------------------------------------------------- MAP (Leaflet + OpenStreetMap)
let lmap=null,layer=null,userDot=null;
function initMap(){
  if(lmap)return;
  lmap=L.map("lmap",{zoomControl:false,attributionControl:true}).setView([31.52,74.33],12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(lmap);
  lmap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  layer=L.layerGroup().addTo(lmap);
  lmap.on("click",onMapClick);
}
const ll=p=>[p.lat,p.lng];
function pinIcon(label,col){return L.divIcon({className:"",iconSize:[0,0],html:`<div style="position:relative"><div class="pinlbl">${label}</div><div style="position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid ${col};box-sizing:border-box"></div></div>`});}
async function walkPath(a,b){ // real footpath from OSM routing (free demo server); straight line if unavailable
  try{const u=`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r=await fetch(u);const j=await r.json();if(j.routes&&j.routes[0])return{pts:j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]),m:j.routes[0].distance};}catch(e){}
  return{pts:[ll(a),ll(b)],m:null};}
function drawMap(){
  layer.clearLayers();
  const trip=state.mapMode==="trip"?state.trip:null;const dim=trip?0.3:1;
  for(const Ln of Object.values(LINES))L.polyline(Ln.stops.map(ll),{color:Ln.color,weight:5,opacity:dim}).addTo(layer);
  if(trip){
    for(const l of trip.legs){
      if(l.type==="ride")L.polyline(l.stops.map(ll),{color:LINES[l.line].color,weight:8,opacity:1}).addTo(layer);
      else if(l.m>=40){const line=L.polyline([ll(l.from),ll(l.to)],{color:"#c8ced4",weight:4,dashArray:"1 9",lineCap:"round"}).addTo(layer);
        walkPath(l.from,l.to).then(w=>{line.setLatLngs(w.pts);});}
    }
  }
  for(const s of STATIONS){const on=trip&&trip.rides.some(r=>r.stops.includes(s));const show=!trip||on;
    const m=L.circleMarker(ll(s),{radius:on?6:5,color:LINES[s.line].color,weight:3,fillColor:"#141619",fillOpacity:1,opacity:show?1:dim}).addTo(layer);
    m.bindTooltip(s.name+(s.under?" (underground)":""),{direction:"right",className:"st-label",permanent:!!(trip&&trip.rides.some(r=>r.from===s||r.to===s))});}
  if(trip){L.marker(ll(state.from),{icon:pinIcon("Start","#1fc77e")}).addTo(layer);L.marker(ll(state.to),{icon:pinIcon("End","#1f9ee0")}).addTo(layer);}
  if(state.mapMode==="pick"&&state.pickPt)L.marker(ll(state.pickPt),{icon:pinIcon(state.picking==="from"?"Start":"End",state.picking==="from"?"#1fc77e":"#1f9ee0")}).addTo(layer);
}
function openMap(mode){state.mapMode=mode;show("s-map");initMap();
  $("pickbar").hidden=mode!=="pick";$("mapctl").style.bottom=mode==="pick"?"86px":"28px";
  $("map-title").textContent=mode==="pick"?(state.picking==="from"?"Choose start":"Choose destination"):mode==="trip"?"Your trip":"Network map";
  state.pickPt=null;$("pick-ok").disabled=true;$("pick-txt").textContent="Tap the map to set the point";
  setTimeout(()=>{lmap.invalidateSize();drawMap();
    if(mode==="trip"){const pts=[state.from,state.to];state.trip.rides.forEach(r=>pts.push(...r.stops));lmap.fitBounds(L.latLngBounds(pts.map(ll)),{padding:[40,40]});}
    else if(mode==="network")lmap.fitBounds(L.latLngBounds(STATIONS.map(ll)),{padding:[20,20]});
    else{const ref=state[state.picking]||state[state.picking==="from"?"to":"from"];if(ref)lmap.setView(ll(ref),15);else lmap.setView([31.52,74.33],13);}
  },60);}
$("nav-map").onclick=()=>openMap("network");
$("map-back").onclick=()=>{if(state.mapMode==="trip")show("s-detail");else if(state.mapMode==="pick")show("s-search");else show("s-home");};
async function reverseName(p){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${p.lat}&lon=${p.lng}`);const j=await r.json();
    const a=j.address||{};const parts=[j.name,a.road,a.neighbourhood||a.suburb||a.quarter].filter(Boolean);return parts.slice(0,2).join(", ")||"Pinned point";}catch(e){return "Pinned point";}}
async function onMapClick(e){if(state.mapMode!=="pick")return;const p={lat:e.latlng.lat,lng:e.latlng.lng,name:"Pinned point"};
  state.pickPt=p;drawMap();$("pick-ok").disabled=false;$("pick-txt").textContent="Finding the address…";
  const near=STATIONS.map(s=>({s,d:dist(p,s)})).sort((a,b)=>a.d-b.d)[0];
  const nm=await reverseName(p);if(state.pickPt!==p)return;p.name=nm;
  $("pick-txt").textContent=nm+" · "+(near.d<1000?Math.round(near.d)+" m":(near.d/1000).toFixed(1)+" km")+" to "+near.s.name;}
$("pick-ok").onclick=()=>{setPoint(state.picking,state.pickPt);show("s-home");};
function locateMe(cb){
  if(!navigator.geolocation){cb(null,"This browser can't share your location.");return;}
  navigator.geolocation.getCurrentPosition(pos=>cb({lat:pos.coords.latitude,lng:pos.coords.longitude,name:"My location"}),
    err=>cb(null,err.code===1?"Location permission was refused. Allow it in your browser settings, or pick on the map.":"Couldn't get your location. Try again outdoors, or pick on the map."),{enableHighAccuracy:true,timeout:12000});}
$("locate").onclick=()=>locateMe((p,msg)=>{if(!p){$("pick-txt").textContent=msg||"";return;}
  if(userDot)userDot.remove();userDot=L.circleMarker(ll(p),{radius:8,color:"#fff",weight:3,fillColor:"#1f9ee0",fillOpacity:1}).addTo(lmap);lmap.setView(ll(p),16);
  if(state.mapMode==="pick"){state.pickPt=p;drawMap();$("pick-ok").disabled=false;$("pick-txt").textContent="My location";}});

// ---------------------------------------------------------------- LINES SCREEN
function renderLines(){
  $("lines").innerHTML=Object.values(LINES).map(L=>`<div style="padding:16px 18px 6px;display:flex;align-items:center;gap:10px"><span class="badge ${L.cls}" style="font-size:16px">${L.short}</span><div><div class="t" style="font-size:18px;font-weight:700">${L.name}</div><div class="sub">${L.stops[0].name} ↔ ${L.stops[L.stops.length-1].name} · ${L.stops.length} stations · every ~${L.headway} min · 06:00–22:00</div><div class="sub">Fare: ${L.id==="MB"?"Rs 30 flat":"Rs 25–45 by distance"}</div></div></div>`+
   L.stops.map(s=>`<div class="mid"><div class="c"><span class="vbar" style="background:${L.color};min-height:38px"></span></div><div class="b"><span class="tt tnum">${L.cumKm[s.i].toFixed(1)} km</span><span>${s.name}${s.under?' <span class="sub">· underground</span>':""}${(L.id==="OL"&&s.name==="Anarkali")||(L.id==="MB"&&s.name==="MAO College")?' <span class="badge '+(L.id==="OL"?"mb":"ol")+'" style="font-size:11px">'+(L.id==="OL"?"MB":"OL")+'</span>':""}</span></div></div>`).join("")).join("")+`<div style="height:30px"></div>`;}
renderLines();
$("tab-lines").onclick=$("nav-lines").onclick=()=>show("s-lines");
$("lines-back").onclick=()=>show("s-home");

// expose for testing
window.__plan=plan;window.__LINES=LINES;window.__T=TRANSFERS;
</script>
