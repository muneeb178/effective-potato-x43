.cityico{display:inline-block;width:22px;height:24px;background:currentColor;-webkit-mask:var(--minar) center/contain no-repeat;mask:var(--minar) center/contain no-repeat}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0c0e;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,label{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button,button:focus,button:focus-visible,input:focus,input:focus-visible{outline:none}*{-webkit-tap-highlight-color:transparent}
.phone{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);visibility:hidden;pointer-events:none;contain:layout paint;will-change:transform;transform:translateZ(0)}
.screen.on,.screen.under,.screen.out-r{visibility:visible}
.screen.on{pointer-events:auto}
.screen.under{z-index:1}.screen.on{z-index:2}
.screen.in-r{z-index:3;animation:inR .4s cubic-bezier(.25,.8,.3,1) both;will-change:transform,opacity;backface-visibility:hidden}
.screen.out-r{z-index:3;animation:outR .32s cubic-bezier(.4,0,.6,1) both;will-change:transform,opacity;backface-visibility:hidden}
.screen.in-l{animation:inL .4s cubic-bezier(.25,.8,.3,1) both;will-change:transform,opacity}
/* tab switch (bottom nav <-> Map): Jakdojade-style cross-fade with a slight drift */
.screen.fi{z-index:3;animation:fadeIn .45s cubic-bezier(.25,.6,.3,1) both;will-change:opacity,transform}
.screen.fo{visibility:visible;z-index:2;animation:fadeOut .45s ease-in both;will-change:opacity,transform}
@keyframes fadeIn{from{opacity:0;transform:translateX(var(--fx,0))}to{opacity:1;transform:none}}
@keyframes fadeOut{0%{opacity:1;transform:none}60%{opacity:1}100%{opacity:0;transform:translateX(var(--fx2,0))}}
@keyframes inR{from{transform:translateX(18%);opacity:0}to{transform:none;opacity:1}}
@keyframes outR{from{transform:none;opacity:1}to{transform:translateX(18%);opacity:0}}
@keyframes inL{from{transform:translateX(-5%);opacity:.5}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.note{color:var(--muted);font-size:14px;padding:16px 20px;line-height:1.45}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.pill{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.hright{display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;flex:none}
.iconbtn.round{background:var(--surface-2);width:38px;height:38px}

/* tabs */
.tabs{display:flex;border-bottom:3px solid var(--surface-2);margin:0 0 12px;flex:none}
.tab{flex:1;padding:8px 0;font-weight:600;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.tab.on{color:var(--text)}
.tabs{position:relative}
.tabind{position:absolute;left:0;bottom:-3px;width:50%;height:3px;background:var(--text);will-change:transform}
.homebody{timeline-scope:--tabsx}
.tabclip{scroll-timeline:--tabsx x}
@keyframes tabslide{from{transform:translateX(0)}to{transform:translateX(100%)}}
@supports (animation-timeline:scroll()){#tabs .tabind{animation:tabslide linear both;animation-timeline:--tabsx}}
#s-search .tabind{transform:none}
.tab{transition:color .25s}
.tabclip{flex:1;position:relative;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tabclip::-webkit-scrollbar{display:none}
.tabtrack{display:flex;width:200%;height:100%}
.tabpane{width:50%;height:100%;display:flex;flex-direction:column;min-height:0;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
#lines{overflow-y:auto;padding:0 0 90px}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.sub .nw{white-space:nowrap}
.lcard{margin:0 12px 10px;border-radius:14px;overflow:hidden;flex:none;position:relative}
.lhead,.ltog{background:var(--surface);position:relative;z-index:1}
.lcard:not(.open) .ltog{border-radius:0 0 14px 14px}
.lbody>div{background:var(--surface);border-radius:0 0 14px 14px}
.lhead{display:flex;gap:12px;align-items:flex-start;padding:13px 14px 10px}
.lhead .nm{font-size:16px;font-weight:700}
.ltog{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.ltog svg{transition:transform .3s}
.lcard.open .ltog svg{transform:rotate(180deg)}
.lbody{display:none}
.lcard.open .lbody{display:block}
@keyframes lfade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.lst{display:grid;grid-template-columns:64px 20px 1fr;align-items:center;height:32px;padding:0 14px 0 0;font-size:15px}
.lst .km{color:var(--muted);text-align:right;padding-right:10px;font-size:13px}
.lst .rail{position:relative;height:100%;display:flex;justify-content:center}
.lst .rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--lc)}
.lst:first-child .rail::before{top:50%}.lst:nth-last-child(2) .rail::before{bottom:50%}
.lst .rail i{position:relative;align-self:center;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--lc)}
.lst .x{display:flex;gap:6px;align-items:center;padding-left:8px;min-width:0}
.lst .x>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* from / to */
.fields{padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;position:relative;flex:none}
.fields::before{content:"";position:absolute;left:37px;top:19px;bottom:19px;width:2px;background:#4a5056}
.field{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:10px;padding:6px 14px;text-align:left;width:100%;min-height:38px;position:relative}
.field .ph{color:var(--muted);font-size:16px}
.field .val{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.dot{width:15px;height:15px;border-radius:50%;flex:none;border:4px solid var(--accent);background:var(--bg);position:relative;z-index:1}
.dot.b{border-color:var(--blue)}
.swap{position:absolute;right:22px;top:44px;width:32px;height:32px;display:grid;place-items:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 10px;flex:none}
.chip{position:relative;background:var(--surface);border-radius:999px;padding:4px 13px;font-weight:500;font-size:15px;display:flex;gap:8px;align-items:center}
#when-in{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.showbtn{position:absolute;left:14px;right:14px;bottom:12px;z-index:21;background:#11a36b;color:#fff;border-radius:12px;padding:11px 18px;font-size:16px;font-weight:600;display:flex;justify-content:center;align-items:center;box-shadow:0 4px 18px #0009}
.showbtn svg{position:absolute;right:18px}
.go{background:var(--accent);color:#06200f;font-weight:700;border-radius:999px;padding:11px 20px;font-size:17px}

/* ad slots: placeholder boxes in standard AdMob sizes */
.adband{background:#000;border-top:1px solid #26292d;border-bottom:1px solid #26292d;padding:4px 0 8px;text-align:center;flex:none}
.adband .lbl{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:4px;font-weight:600}
.adbox{margin:0 auto;width:300px;max-width:calc(100% - 24px);height:250px;border:1px dashed #3a3f45;display:grid;place-items:center;color:#5f666e;font-size:13px;background:repeating-linear-gradient(45deg,#0c0d0f 0 10px,#111316 10px 20px)}
.adband.slim .adbox{width:320px;height:100px}
.homebody{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* routes history bottom sheet */
.hsscroll{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:20;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.hsscroll::-webkit-scrollbar{display:none}
.hsspace{height:172px;scroll-snap-align:start}
.hsheet{position:relative;height:100%;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 12px #0007;pointer-events:auto;scroll-snap-align:end}
.hsheet[hidden]{display:none}
.showbtn{transition:opacity .2s}
.hs-top{cursor:pointer;padding:8px 0 2px;flex:none}
.grab{width:40px;height:4px;border-radius:3px;background:#4a5056;margin:2px auto 6px}
.hs-title{display:flex;justify-content:space-between;align-items:center;padding:0 10px 0 20px}
.hs-title h2{font-size:21px;font-weight:700;letter-spacing:-.4px;padding:0 0 4px}
#hs-close{display:none}
.hsheet.open #hs-close{display:grid}
.hsheet.open .grab{visibility:hidden;height:0;margin:0}
#hist{flex:1;overflow-y:auto;padding-bottom:20px}
.hsheet:not(.open) #hist{overflow:hidden}
.hsheet:not(.open) .hday{display:none}
.hday{color:var(--muted);font-size:14px;padding:18px 20px 2px}
.hist{display:block;width:100%;text-align:left;padding:10px 20px 12px}
/* swipe left on a history trip to delete it */
.tabclip,#phone{overscroll-behavior-x:none}
/* history row = its own native sideways scroller (smooth at 120 Hz like the tabs); red tail sits to the right of the trip */
.hwrap{position:relative;overflow:hidden;touch-action:pan-y}
.hwrap>.hist{position:relative;z-index:1;background:var(--surface,#1c1f24);will-change:transform}
.hwrap>.hdel{position:absolute;top:1px;bottom:1px;left:0;right:0;visibility:hidden;display:flex;align-items:center;background:#ff4048;color:#fff;font-weight:600;font-size:15px}
.hwrap.sw>.hdel{visibility:visible}
.hwrap>.hdel span{position:absolute;top:50%;left:0;white-space:nowrap;will-change:transform}

.hist .l{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:500;line-height:1.2}
.hist .arr{color:var(--muted);font-size:12px;padding:0 0 0 3px;line-height:12px;height:12px}

/* bottom nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 0 calc(5px + env(safe-area-inset-bottom));flex:none;position:relative;z-index:25}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--text)}

/* search */
.sf{padding:0 4px 0 14px}
.sf input{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:16px;font-weight:500;padding:9px 0;outline:none}
.sf input::placeholder{color:var(--muted);font-weight:400}
.sf{transition:min-height .28s cubic-bezier(.22,.9,.24,1),background-color .28s}
.sf input{transition:transform .28s cubic-bezier(.22,.9,.24,1);transform-origin:0 50%;will-change:transform;font-size:16px!important}
.sf.act{background:var(--surface-2);min-height:50px}
.sf.act input{transform:scale(1.15);width:87%}
#s-search .fields{contain:layout}
.sf .loc{transition:opacity .2s,transform .12s;position:relative;z-index:2;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.sf .loc.press{transform:scale(.88)}.sf .loc.busy svg{animation:locpulse 1s ease-in-out infinite}
.sf .loc{display:grid;opacity:0;pointer-events:none}.sf.act .loc{opacity:1;pointer-events:auto}
#opts{background:#000;margin-top:10px}
#opts.fade{animation:ofade .18s ease-out}
@keyframes ofade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 8px 10px 16px;border-bottom:2px solid #000;background:var(--surface)}
.oico{width:34px;height:34px;border-radius:50%;border:2.5px solid #e6e9ec;display:grid;place-items:center;flex:none;color:#e6e9ec}
.oico.stn{border-radius:11px;font-weight:800;font-size:13px}
.otx{flex:1;min-width:0}
.opt .t{font-size:16px;font-weight:600;line-height:1.25}
.opt .s{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km{color:var(--blue)}
.fill{width:38px;height:38px;display:grid;place-items:center;color:#c8ced4;flex:none;border-radius:50%}
.sec{color:var(--muted);font-size:12px;padding:12px 16px 6px;background:#000;letter-spacing:.3px}
.loading{padding:16px 18px;color:var(--muted);font-size:14px;background:var(--surface)}
.selmap{display:flex;align-items:center;gap:16px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));font-size:16px;font-weight:600;background:var(--surface);border-top:8px solid #000;flex:none;width:100%;text-align:left}

/* results */
.rhead{display:flex;gap:12px;padding:2px 16px 10px;align-items:center;flex:none}
.rhead .ft{flex:1;display:grid;grid-template-columns:16px 1fr;gap:6px 12px;align-items:center;font-size:16px;font-weight:600;min-width:0;text-align:left}
.rhead .ft div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vline{grid-row:1/3;align-self:stretch;display:flex;flex-direction:column;align-items:center}
#cards{background:#000}
.card{display:grid;grid-template-columns:auto 1fr;gap:0 14px;width:calc(100% - 20px);margin:10px;background:var(--surface);border-radius:14px;padding:13px 14px 12px;text-align:left;align-items:start}
.card:active{background:#262a2f}
.dep{min-width:72px}
.dep small{display:block;font-size:13px;color:#d5dade;font-weight:500}
.dep b{display:block;font-size:36px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin-top:2px}
.dep b i{font-style:normal;font-size:16px;font-weight:600;letter-spacing:0;margin-left:3px}
.crt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:6px;color:#e6e9ec}
.chev{color:var(--muted)}
.badge{border-radius:6px;padding:2px 7px;font-weight:800;font-size:13px;color:#fff;display:inline-flex;align-items:center}
.badge.ol{background:var(--ol);color:#2a1400}
.badge.mb{background:var(--mb)}
.badge.ev{background:#2fd27a;color:#05230f}
.badge.e20{background:#9be05a;color:#0d2405}
.badge.e26{background:#2ec4b0;color:#032420}
.badge.sp{color:#fff}.badge.s03{background:#3b82f6;color:#0b1220}.badge.s04{background:#a78bfa;color:#0b1220}.badge.s05{background:#f472b6;color:#0b1220}.badge.s07{background:#38bdf8;color:#0b1220}.badge.s08{background:#818cf8;color:#0b1220}.badge.s09{background:#e879f9;color:#0b1220}.badge.s10{background:#fbbf24;color:#0b1220}.badge.s11{background:#22d3ee;color:#0b1220}.badge.s12{background:#fde047;color:#0b1220}.s13{background:#f0abfc;color:#0b1220}.s14{background:#fca5a5;color:#0b1220}.s15{background:#bef264;color:#0b1220}.s16{background:#e5e7eb;color:#0b1220}.s17{background:#fdba74;color:#0b1220}.badge.s19{background:#4d7c0f}
.tot{color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap}
.legs{display:flex;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center;gap:4px;margin-top:9px;font-size:13px;letter-spacing:-.1px;color:#c3c9ce}
.wk{display:inline-flex;align-items:center;gap:1px}
.wk svg{width:14px;height:14px}
.t-g{background:var(--accent);color:#06200f;font-weight:600;border-radius:999px;padding:1px 6px}
.t-b{background:var(--blue);color:#021623;font-weight:600;border-radius:999px;padding:1px 6px}
.cmeta{font-size:12px;color:var(--muted);margin-top:7px}
.spin{position:absolute;left:50%;top:46%;width:30px;height:30px;margin:-15px;border-radius:50%;border:3px solid #ffffff26;border-top-color:#e6e9ec;animation:spin .8s linear infinite;z-index:5}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{margin:12px;padding:12px 14px;border-radius:12px;background:#3a2a10;color:#ffd391;font-size:14px;line-height:1.45}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:6px 16px 0}

/* trip detail: map left, sliding timeline right */
.dsum{padding:0 16px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:start;flex:none}
.dsplit{position:relative;flex:1;overflow:hidden;background:#2a3242;min-height:0}
.rchip{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:5px;font-weight:800;font-size:10px;color:#fff;transform:translate(-50%,-50%);white-space:nowrap;box-shadow:0 2px 8px #0008;border:2px solid #0006}
.rchip svg{display:none}
.lbl-hide .perm{display:none}
.xfer{width:22px;height:22px;border-radius:6px;background:#f2f4f5;color:#121417;display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 2px 8px #0008}
.tad{padding:16px 0 0}
.tad.rest{display:none}
.dhdr{position:relative;z-index:5;background:var(--bg)}
.dbody{position:absolute;left:0;right:0;top:var(--hdr,54px);height:calc(100% - var(--hdr,54px) + var(--adh,121px));display:flex;flex-direction:column;
  transition:transform .6s cubic-bezier(.2,.8,.25,1);will-change:transform}
.dbody.adhide{transform:translateY(calc(-1 * var(--adh,121px)))}
.dad .adband{transition:opacity .55s ease .1s}
.dbody.adhide .dad .adband{opacity:0}
#s-detail .dfoot{display:flex}
#s-detail .dfoot{transform:translateY(calc(100% + 24px));opacity:0;transition:transform .45s cubic-bezier(.2,.8,.25,1),opacity .3s ease;will-change:transform,opacity}
#s-detail.open.ft .dfoot{transform:none;opacity:1}
.dad{flex:none}
.dmapctl{z-index:620}

.credit{background:#000a;color:#c8ced4;font:500 10px var(--font);padding:2px 6px;border-radius:4px;margin:4px!important;border:0}
#dmap{position:absolute;inset:0;z-index:0}
.tpscroll{position:absolute;inset:0;z-index:600;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;pointer-events:none;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tpscroll::-webkit-scrollbar{display:none}
.tpspace{flex:none;width:calc(100% - 92px);scroll-snap-align:start}
.tpanel{position:relative;flex:none;width:calc(100% - 46px);height:100%;background:var(--panel);box-shadow:-8px 0 20px #0007;pointer-events:auto;scroll-snap-align:end}
.tscroll{height:100%;overflow-y:auto;padding:10px 0 120px}
.peek{position:absolute;left:0;top:0;bottom:0;width:46px;z-index:650;display:none}
#s-detail.open .peek{display:block}
.dfoot{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:none;gap:10px;z-index:700}
.fbtn{border-radius:11px;padding:9px 13px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 4px 16px #0009;white-space:nowrap}
.fbtn.w{background:#f2f4f5;color:#121417}
.fbtn.y{background:var(--yellow);color:#1b1600;flex:1}
.st{display:grid;grid-template-columns:92px 1fr;gap:0 8px;padding:0 16px 0 0}
.st .c{display:flex;flex-direction:column;align-items:center}
.st .b{padding:6px 0 12px;min-width:0}
.st.sep .b{border-top:3px solid #0b0c0e;padding-top:12px}
.st.sep .c{padding-top:12px}
.time{border-radius:999px;font-weight:700;padding:3px 9px;font-size:14px;background:var(--surface-2)}
.time.g{background:var(--accent);color:#06200f}
.time.bl{background:var(--blue);color:#021623}
.time.o::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;border:3px solid #fff;margin-right:6px;vertical-align:-1px}
.vbar{width:6px;flex:1;min-height:20px;border-radius:0}
.ring{width:16px;height:16px;border-radius:50%;border:4px solid;background:var(--panel);margin-top:-2px;flex:none}
.tog svg{transition:transform .25s}
.tog.open svg{transform:rotate(180deg)}
.vdots{flex:1;min-height:34px;width:6px;background:radial-gradient(circle,#7d848b 2.6px,transparent 3px) center/6px 14px repeat-y}
.circ{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;margin:6px 0}
.sname{font-size:17px;font-weight:700;line-height:1.25}
.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.4}
.ride{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;flex-wrap:wrap}
.ride .dur{margin-left:auto;color:var(--muted)}
.freq{font-size:14px;margin-top:8px}
.tog{display:flex;justify-content:space-between;width:100%;padding:10px 0 8px;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.walk{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:8px 0}
.walk span:last-child{color:var(--muted);white-space:nowrap;padding-left:10px}
.pm{display:grid;grid-template-columns:92px 1fr;gap:0 8px;padding:0 16px 0 0;height:33px}
.pm .c{display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.pm .c .vbar{min-height:8px}
.pm .mt{font-size:14px;font-weight:700;padding:1px 0;line-height:1.2}
.pm .b{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.pm .b .n{color:var(--muted)}

/* lines screen */
.mid{display:grid;grid-template-columns:86px 1fr;gap:0 12px;padding:0 18px}
.mid .c{display:flex;justify-content:center}
.mid .b{display:flex;gap:10px;padding:9px 0;font-size:15px;color:#d5dade}
.mid .b .tt{color:var(--muted);width:50px;flex:none}

/* maps */
.mapwrap{position:relative;flex:1;overflow:hidden;background:#2a3242}
.mapctl button:active,.mapctl button.press{transform:scale(.9);background:#2a2f35}
.mapctl button.busy svg{animation:locpulse 1s ease-in-out infinite}
@keyframes locpulse{50%{opacity:.35}}
.mapctl{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.mapctl button{width:48px;height:48px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,background .2s;border-radius:50%;background:#1d2024;display:grid;place-items:center;box-shadow:0 2px 12px #0008}
.legend{position:absolute;right:12px;top:12px;background:#000b;border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px}
.legend .spd-btn{all:unset;display:flex;align-items:center;gap:6px;cursor:pointer;font:inherit;color:inherit}
.legend .spd-btn b{font-weight:400;opacity:.7;margin-left:auto;padding-left:6px;transition:transform .2s}
.legend .spd-btn[aria-expanded="true"] b{transform:rotate(180deg)}
.spd-list{display:grid;gap:2px;margin-top:2px;max-height:46vh;overflow:auto;max-width:230px}
.spd-list label{display:flex;align-items:center;gap:7px;padding:5px 2px;cursor:pointer;line-height:1.25}
.spd-list input{accent-color:var(--c,#2563eb);margin:0;width:15px;height:15px;flex:none}
.spd-list .spd-all{all:unset;cursor:pointer;color:#9fb3c8;font-size:11.5px;padding:3px 2px}
.spd-list .nm{display:block;min-width:0}
.pickbar{position:absolute;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px #000a}
.pickbar[hidden]{display:none}
.pickbar .txt{flex:1;font-size:14px;color:var(--muted)}
.pickbar .go:disabled{opacity:.35}
#lmap{position:absolute;inset:0}
.leaflet-container{font-family:var(--font);background:#2a3242}
.leaflet-control-attribution{background:#000a!important;color:#9aa1a8!important;font-size:10px}
.leaflet-control-attribution a{color:#c8ced4!important}
.leaflet-tooltip.st-label{background:#141619e6;border:0;color:#e6e9ec;font-weight:600;font-size:12px;padding:2px 6px;border-radius:6px;box-shadow:none}
.leaflet-tooltip.st-label::before{display:none}
.pinlbl{background:#f2f4f5;color:#121417;font-weight:700;font-size:11px;padding:2px 7px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-160%);display:inline-block;box-shadow:0 2px 8px #0007}

.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:#f2f4f5;color:#121417;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:2000}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hsscroll,.toast,.lbody{transition:none}.screen{animation:none!important}}

/* Lines tab: route-number buttons for bus routes (Jakdojade "Schedules" style) */
.lsec{margin:16px 16px 8px;font-weight:700;font-size:15px}.lsec .sub{font-weight:500;margin-left:6px}
.lgrid{display:flex;flex-wrap:wrap;gap:12px 18px;padding:2px 16px 6px}
.lnum{min-width:38px;height:30px;padding:0 8px;border:1.5px solid #3b4046;border-radius:7px;font-weight:700;font-size:15px;display:grid;place-items:center;color:#fff;background:transparent}
.lnum.off{color:#5c636b;border-color:#2c3035}
/* single line page: full map + pull-up sheet (native scroll) */
#s-line{background:#000}
#lnmap{position:absolute;inset:0;z-index:0}
#lnmap .leaflet-top.leaflet-left{left:auto;right:6px;top:calc(env(safe-area-inset-top) + 6px)}
.lnback{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:30;background:#16181bdd;width:48px;height:48px}
.lnsheet{position:absolute;left:0;right:0;top:0;z-index:20;background:var(--panel,#191b1e);border-radius:22px 22px 0 0;box-shadow:0 -6px 18px #0008;display:flex;flex-direction:column;will-change:transform}
.lnsheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 2px);height:120vh;background:inherit;pointer-events:none}
.lntop{position:absolute;left:0;right:0;top:0;z-index:19;background:var(--panel,#191b1e);opacity:0;pointer-events:none;will-change:opacity}
.lntop.anim{transition:opacity .38s cubic-bezier(.25,.8,.3,1)}
.lnsheet.anim{transition:transform .38s cubic-bezier(.25,.8,.3,1)}
.lnbody{flex:1;min-height:0;overflow:hidden;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:30px}.lnbody::-webkit-scrollbar{display:none}
.lnsheet.up .lnbody{overflow-y:auto;touch-action:pan-y}
.lnsheet .grab{width:42px;height:5px;border-radius:9px;background:#3a3f45;margin:9px auto 14px}
.lnhead{display:flex;align-items:center;gap:10px;padding:0 18px}.lnhead .op{margin-left:auto;color:var(--muted);font-size:14px}
.lnhead .bnum{background:#fff;color:#111;border-radius:8px;padding:2px 9px;font-weight:800;font-size:19px}
.lndir{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.lndir .to{font-weight:800;font-size:22px;text-transform:uppercase;flex:1;min-width:0;line-height:1.15}
.lndir .sw{width:44px;height:44px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.lnstops{padding:6px 0 0}
.lnst{display:flex;align-items:center;gap:16px;height:52px;padding:0 18px;position:relative;font-size:16px}
.lnst::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:3px;background:var(--lc)}
.lnst:first-child::before{top:50%}.lnst:last-child::before{bottom:50%}
.lnst i{width:16px;height:16px;border-radius:50%;border:3px solid var(--lc);background:var(--panel,#191b1e);position:relative;z-index:1;flex:none;margin-left:3px}
.lnst .tb{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
#lines,.tscroll{overflow-anchor:none}
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;pointer-events:none}
.leaflet-tooltip.st-label{white-space:normal;max-width:170px;width:max-content;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="phone" id="phone">

<!-- HOME -->
<section class="screen on" id="s-home">
  <div class="hdr">
    <button class="iconbtn" id="home-back" aria-label="Clear trip" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <div class="brand" id="brand">
      <svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="7" cy="22" r="3.5" fill="none" stroke="#fff" stroke-width="1.9"/><circle cx="23" cy="7" r="3.5" fill="none" stroke="#fff" stroke-width="1.9"/><path d="M9.5 19.5 C14 15, 16 14, 20.5 9.5" stroke="#1fc77e" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>Lahore Transit</span>
    </div>
    <div class="hright">
      <span class="pill tnum" id="clock">--:--</span>
      <button class="iconbtn" id="profile" aria-label="Account"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    </div>
  </div>
  <div class="homebody">
    <div class="tabs" role="tablist" id="tabs"><span class="tabind"></span>
      <button class="tab on" role="tab" aria-selected="true" id="tab-trip">
        <span class="cityico" aria-hidden="true"></span>
        Lahore <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="tab" role="tab" aria-selected="false" id="tab-lines">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 21l2-4M16 21l-2-4"/></svg>
        Lines
      </button>
    </div>
    <div class="tabclip"><div class="tabtrack" id="tabtrack"><div class="tabpane" id="pane-trip">
    <div class="fields">
      <button class="field" id="f-from"><span class="dot"></span><span class="ph" id="from-txt">From where?</span></button>
      <button class="field" id="f-to"><span class="dot b"></span><span class="ph" id="to-txt">Where to?</span></button>
      <button class="swap" id="swap" aria-label="Swap start and destination" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M8 20V4M4 8l4-4 4 4M16 4v16M12 16l4 4 4-4"/></svg></button>
    </div>
    <div class="row" id="home-row">
      <label class="chip tnum"><span id="when">Now</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg><input type="time" id="when-in" aria-label="Departure time"></label>
      <button class="chip" id="opts-btn">Options <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h8M15 8h6M3 16h4M11 16h10"/><circle cx="13" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg></button>
    </div>
    <div class="adband" id="ad-home"><div class="lbl">AD</div><div class="adbox">Ad space · 300 × 250</div></div>
  <div class="hsscroll" id="hsscroll"><div class="hsspace" id="hsspace"></div><div class="hsheet" id="hsheet" hidden>
    <div class="hs-top" id="hs-top"><div class="grab"></div>
      <div class="hs-title"><h2>Routes history</h2><button class="iconbtn" id="hs-close" aria-label="Close history"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    </div>
    <div id="hist"></div>
  </div></div>
  <button class="showbtn" id="go" hidden>Show routes<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
    </div><div class="tabpane" id="lines"></div></div></div>
  </div>
  <nav class="nav" id="nav">
    <button class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 2 12l10 10 10-10Zm1 13v-3H9v3H7v-4a1 1 0 0 1 1-1h5V7l4 4Z"/></svg>Trip</button>
    <button id="nav-lines"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Lines</button>
    <button id="nav-map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  </nav>
</section>

<!-- SEARCH -->
<section class="screen" id="s-search">
  <div class="hdr">
    <button class="iconbtn" id="search-back" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <div class="hright"><span class="pill tnum" id="s-clock"></span><span class="iconbtn" aria-hidden="true"></span></div>
  </div>
  <div class="tabs" role="presentation"><span class="tabind"></span>
    <button class="tab on" tabindex="-1"><span class="cityico" aria-hidden="true"></span>Lahore <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="tab" id="s-tab-lines" tabindex="-1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 21l2-4M16 21l-2-4"/></svg>Lines</button>
  </div>

  navigator.geolocation.getCurrentPosition(pos=>cb({lat:pos.coords.latitude,lng:pos.coords.longitude,name:"My location"}),
    err=>cb(null,err.code===1?"Location is blocked. Allow it in your browser settings, or select on the map.":"Couldn't get your location. Try again, or select on the map."),{enableHighAccuracy:true,timeout:12000});}
// fast locate: answer at once from a recent fix (or the phone's quick network fix), then refine with GPS; the button reacts on touch, not after the click delay
let lastFix=null,locWatch=null;
function startWatch(){if(locWatch!==null||!navigator.geolocation)return;try{locWatch=navigator.geolocation.watchPosition(p=>{lastFix={lat:p.coords.latitude,lng:p.coords.longitude,name:"My location",t:Date.now(),acc:p.coords.accuracy};},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}catch(e){}}
function locateFast(btn,cb){if(!navigator.geolocation){cb(null,"This browser can't share your location.");return;}
  let done=false,got=false;const fin=()=>{btn&&btn.classList.remove("busy");};btn&&btn.classList.add("busy");
  if(lastFix&&Date.now()-lastFix.t<60000){got=true;cb(lastFix,null,true);}
  navigator.geolocation.getCurrentPosition(p=>{if(got)return;got=true;cb({lat:p.coords.latitude,lng:p.coords.longitude,name:"My location"},null,true);},()=>{},{enableHighAccuracy:false,maximumAge:120000,timeout:4000});
  navigator.geolocation.getCurrentPosition(p=>{done=true;fin();const f={lat:p.coords.latitude,lng:p.coords.longitude,name:"My location"};lastFix={...f,t:Date.now()};cb(f,null,!got);got=true;startWatch();},
    err=>{done=true;fin();if(!got)cb(null,err.code===1?"Location is blocked. Allow it in your browser settings, or select on the map.":"Couldn't get your location. Try again, or select on the map.");},{enableHighAccuracy:true,maximumAge:0,timeout:12000});}

function foldRows(el,open,tog,done){ // Jakdojade-style: the stop list fades/squeezes as ONE block while the content below glides (transform+opacity only)
  const box=el.closest(".tscroll,#lines")||el.parentElement,E="cubic-bezier(.3,.75,.25,1)",D=420;
  const below=[];for(let n=el;n&&n!==box;n=n.parentElement){let x=n.nextElementSibling;while(x){below.push(x);x=x.nextElementSibling;}}
  [el,...el.children,...below].forEach(n=>n.getAnimations().forEach(a=>a.cancel()));
  [el,...below,...el.querySelectorAll(".pm .b,.pm .mt")].forEach(n=>{n.getAnimations().forEach(a=>a.cancel());n.style.transform="";n.style.clipPath="";n.style.opacity="";n.style.willChange="";});
  if(tog)tog.classList.toggle("open",open);
  const trip=!!el.querySelector(".pm"); // trip stop lists: only text fades, line extends. Lines tab: whole list fades as one block (approved version)
  const fx=()=>trip?[...el.querySelectorAll(".pm .b,.pm .mt")]:[el];
  if(open){el.hidden=false;
    // 60/120 fps reveal: no layout per frame. Everything is set to its start state synchronously (before the next paint, so no flash),
    // then only transform / clip-path / opacity animate: content below glides down from where it was, the list is uncovered top-down in step and fades in.
    const h=el.offsetHeight,SOFT="cubic-bezier(.4,0,.2,1)",T=620;
    below.forEach(n=>{n.style.transform=`translateY(${-h}px)`;n.style.willChange="transform";});
    el.style.clipPath="inset(0 0 100% 0)";el.style.willChange="clip-path";const F=fx();F.forEach(n=>n.style.opacity="0");
    const anims=below.map(n=>n.animate([{transform:`translateY(${-h}px)`},{transform:"translateY(0)"}],{duration:T,easing:SOFT,fill:"both"}));
    anims.push(el.animate([{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0% 0)"}],{duration:T,easing:SOFT,fill:"both"}));
    F.forEach(n=>anims.push(n.animate([{opacity:0},{opacity:.2,offset:.3},{opacity:1}],{duration:T,easing:"linear",fill:"both"})));const L=anims[anims.length-1];
    L.onfinish=()=>{[el,...below,...F].forEach(n=>{n.style.transform="";n.style.clipPath="";n.style.opacity="";n.style.willChange="";});anims.forEach(x=>x.cancel());done&&done();};
  }else{const h=el.offsetHeight;
    // if the list is scrolled near its end, shortening it would make the view jump at the end; ease the scroll there instead

    else el.animate([{opacity:1,transform:"none",transformOrigin:"top"},{opacity:0,transform:"translateY(-8px) scaleY(.9)",transformOrigin:"top"}],{duration:230,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"});
    const a=below.map(n=>n.animate([{transform:"none"},{transform:`translateY(${-h}px)`}],{duration:D-40,easing:E,fill:"forwards"}));
    const fin=()=>{const keep=box.scrollTop;el.hidden=true;[el,...below].forEach(n=>n.getAnimations().forEach(x=>x.cancel()));if(need<=0)box.scrollTop=keep;done&&done();};
    if(a.length)a[0].onfinish=fin;else setTimeout(fin,D-40);}}

(function(){ // sheet drag: header always drags; the list scrolls natively once the sheet is up, and pulling down at its top drags the sheet back
  const sh=$("lnsheet"),body=$("lnbody");let y0=0,s0=0,mode=0,raf=0,ny=0,vt=[];

  sh.addEventListener("touchmove",e=>{const t=e.touches[0],dy=t.clientY-y0;vt.push([performance.now(),t.clientY]);if(vt.length>6)vt.shift();
